<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Раздел 2. Физические характеристики атмосферы</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/meteo.css">
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']]},svg:{fontCache:'global'},startup:{ready(){MathJax.startup.defaultReady();MathJax.startup.promise.then(()=>{if(window.FP)FP.typeset(document.body)})}}};</script>
<script src="assets/tex-svg.js" async></script>
<script src="assets/meteo.js"></script>
<style>
.bar-types{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.bar-types .glass{padding:16px 18px;border-radius:20px}
.bar-types h4{margin:0 0 6px;font-family:var(--f-serif);font-size:1.3rem;font-weight:600}
.bar-types p{margin:0;font-size:.88rem;color:var(--ink-2)}
</style>
</head>
<body>
<script>
(function(){
const {f,sg,ro,ISA,slider,vals,out,bind}=FP; const FT=ISA.FT;
const QZ='<div class="quiz quiz-host"></div>';
const stub=(title,items)=>`<div class="stub"><div class="kick">Раздел в разработке</div><h3 class="h" style="margin-top:8px">${title}</h3><p style="margin:.3em 0 0">План содержания:</p><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
const E=t=>6.112*Math.exp(17.62*t/(243.12+t)); // давление насыщения над водой, гПа (формула Магнуса)

/* ---------- 2.1 ---------- */
const s21={id:'s21',n:'2.1',title:'Параметры атмосферы',h1:'Температура, влажность, <em class="acc">давление,</em> плотность',
 rpd:'Раздел 2 «Физические характеристики атмосферы»',f:String.raw`\(f = \dfrac{e}{E}\cdot 100\,\%\)`,
 tabs:{theory:String.raw`<p class="lead">Состояние атмосферы в точке описывают четыре параметра: температура, влажность, давление и плотность. Три из них связаны уравнением состояния, а влажность определяет, когда начнётся конденсация.</p>
 <div class="cols"><div class="glass pad"><h3 class="h">Температура и давление</h3><div class="prose">
  <p><b>Температура</b> – в градусах Цельсия и в кельвинах: \(T = t + 273{,}15\). В авиации США и в части документации – градусы Фаренгейта.</p>
  <p><b>Давление</b> – в гектопаскалях (гПа) и миллиметрах ртутного столба: \(1\ \text{мм рт. ст.} = 1{,}333\ \text{гПа}\). В ряде стран – дюймы ртутного столба (inHg).</p>
  <p><b>Плотность</b> – масса единицы объёма воздуха, кг/м³: \(\rho = \dfrac{p}{RT}\).</p></div></div>
 <div class="glass pad"><h3 class="h">Характеристики влажности</h3><div class="prose">
  <p>\(e\) – парциальное давление водяного пара; \(E\) – давление насыщенного пара, зависит только от температуры.</p>
  <p>\(f = e/E\) – относительная влажность, %.</p>
  <p>\(T_d\) – точка росы: температура, до которой нужно охладить воздух при неизменном \(e\), чтобы пар стал насыщенным.</p>
  <p>\(\Delta = t - T_d\) – дефицит точки росы. Чем он меньше, тем ближе воздух к насыщению: растёт вероятность тумана и низкой облачности.</p></div></div></div>`,
 model:`<div class="glass pad"><div class="ctrls">${slider('h1','Температура воздуха t',-30,40,0.5,12)}${slider('h2','Точка росы Td',-35,40,0.5,8)}${slider('h3','Давление',900,1050,1,1013)}</div></div><div class="ro-grid" data-ro></div><div class="callout" data-msg></div>
  <p class="note">Давление насыщения рассчитано по формуле Магнуса над водой: \\(E = 6{,}112\\,\\exp\\dfrac{17{,}62\\,t}{243{,}12 + t}\\) гПа.</p>`,
 flight:`<div class="glass pad case"><h3 class="h">Температура и точка росы в сводке</h3><div class="prose"><p>В сводке METAR температура и точка росы идут одной группой: <span class="mono">12/08</span> означает t = +12 °C, Td = +8 °C. Отрицательные значения обозначают буквой M: <span class="mono">M02/M05</span>.</p><p>Перед вылетом на DA 40 NG экипаж смотрит на дефицит точки росы, особенно вечером и ночью: при ясном небе и слабом ветре воздух у земли выхолаживается, и при малом дефиците возможен радиационный туман.</p><p>На PFD G1000 температура наружного воздуха выводится в окне OAT.</p></div></div>`,
 quiz:QZ},
 mount:{model(el){bind(el,()=>{let [t,td,p]=vals(el,['h1','h2','h3']);if(td>t){td=t;el.querySelector('#h2').value=t}
   out(el,'h1',`${sg(t,1)} °C`);out(el,'h2',`${sg(td,1)} °C`);out(el,'h3',`${f(p)} гПа / ${f(p/1.33322)} мм`);
   const Es=E(t),e=E(td),rh=e/Es*100,q=622*e/(p-0.378*e),a=e*100/(461.5*(t+273.15))*1000,rho=(p*100-0.378*e*100)/(ISA.R*(t+273.15));
   el.querySelector('[data-ro]').innerHTML=ro('hl','Относительная влажность',`${f(rh)} %`,`f = e / E`)+ro('','Упругость пара e',`${f(e,1)} гПа`,`насыщения E = ${f(Es,1)} гПа`)+ro('','Дефицит точки росы',`${f(t-td,1)} °C`,'t − Td')+ro('','Массовая доля пара',`${f(q,1)} г/кг`,'удельная влажность')+ro('','Абсолютная влажность',`${f(a,1)} г/м³`,'масса пара в 1 м³')+ro('','Плотность влажного воздуха',f(rho,3),'кг/м³');
   const m=el.querySelector('[data-msg]'),d=t-td;m.className='callout'+(d<=2?' warn':'');
   m.innerHTML=d<=2?`<b>Воздух близок к насыщению.</b> При дефиците точки росы ${f(d,1)} °C небольшое охлаждение приведёт к конденсации: возможны туман, дымка, низкая облачность.`:`<b>Влажный воздух легче сухого.</b> Молекула воды легче молекул азота и кислорода, поэтому при той же температуре и давлении влажный воздух немного менее плотный.`})}},
 quiz:[['Точка росы – это температура, при которой:',['водяной пар при неизменном содержании становится насыщенным','вода закипает','лёд начинает таять','относительная влажность равна нулю'],'При охлаждении до точки росы e = E, f = 100 %.'],
  ['В METAR группа M03/M07 означает:',['t = −3 °C, Td = −7 °C','t = 3 °C, Td = 7 °C','видимость 3 км','ветер 3–7 м/с'],'Буква M обозначает отрицательное значение.'],
  ['1 мм рт. ст. равен:',['1,333 гПа','0,75 гПа','10 гПа','1 гПа'],'760 мм рт. ст. × 1,333 = 1013,25 гПа.'],
  ['При малом дефиците точки росы вечером при ясной погоде и слабом ветре вероятен:',['радиационный туман','град','сдвиг ветра на эшелоне','рост видимости'],'Ночное выхолаживание доводит воздух до точки росы.']]};

/* ---------- 2.2 ---------- */
const s22={id:'s22',n:'2.2',title:'Практика 01. Параметры СА по аэрологической диаграмме',short:'Практика 01',h1:'Практика 01. Параметры СА <em class="acc">по аэрологической</em> диаграмме',stub:1,
 rpd:'Раздел 2 «Физические характеристики атмосферы», практическое занятие № 1',
 tabs:{theory:stub('Определение параметров СА с помощью аэрологической диаграммы',['устройство бланка аэрологической диаграммы: изобары, изотермы, сухие и влажные адиабаты, линии массовой доли пара','кривая стандартной атмосферы на диаграмме','интерактивная диаграмма: Вы выбираете уровень, программа показывает t, p и H по СА','задания из практического занятия с автоматической проверкой'])}};

/* ---------- 2.3 ---------- */
const s23={id:'s23',n:'2.3',title:'Методы и средства измерения',h1:'Методы и средства <em class="acc">измерения</em>',stub:1,
 rpd:'Раздел 2 «Физические характеристики атмосферы»',
 tabs:{theory:stub('Измерение параметров атмосферы у Земли и по высотам',['наземные наблюдения на метеостанции аэродрома: термометры, психрометр, барометр, анероид','автоматизированные метеорологические станции на аэродроме','радиозондирование: температура, влажность, давление и ветер по высотам','интерактив: психрометрическая таблица и полёт радиозонда'])}};

/* ---------- 2.4 ---------- */
const s24={id:'s24',n:'2.4',title:'Изменчивость параметров и влияние на полёт',short:'Влияние на полёт',h1:'Изменчивость параметров <em class="acc">и</em> полёт ВС',
 rpd:'Раздел 2 «Физические характеристики атмосферы»',f:String.raw`\(V = M\,a\)`,
 tabs:{theory:`<p class="lead">Температура, давление и плотность меняются в пространстве и во времени: с высотой, по сезонам, в течение суток и при смене воздушных масс. Для экипажа это значит, что взлётно-посадочные характеристики, скороподъёмность и режим на эшелоне каждый раз разные.</p>
 <div class="cols"><div class="glass pad"><h3 class="h">Взлёт и посадка</h3><div class="prose"><p>Меньше плотность (жара, высокое превышение, низкое давление) – больше истинная скорость отрыва и касания при той же приборной, длиннее разбег и пробег, меньше градиент набора.</p></div></div>
 <div class="glass pad"><h3 class="h">Набор, снижение, эшелон</h3><div class="prose"><p>В наборе экипаж или автоматика выдерживают приборную скорость, на больших высотах – число M. Момент перехода от одного к другому зависит от давления. Скорость звука, а значит истинная скорость при заданном M, зависит от температуры.</p></div></div></div>`,
 flight:`<div class="glass pad case jet"><div class="row" style="justify-content:space-between"><h3 class="h">SSJ 100 в наборе</h3><span class="kick">переход с приборной скорости на число M</span></div>
  <div class="ctrls" style="margin-top:12px">${slider('c1','Приборная скорость в наборе, kt',250,320,5,290)}${slider('c2','Число M на эшелоне',0.6,0.81,0.01,0.78)}${slider('c3','Эшелон',100,400,10,350)}</div>
  <div class="ro-grid" data-c style="margin-top:16px"></div>
  <p class="note" style="margin-top:10px">В наборе автоматика выдерживает заданную приборную скорость, число M при этом растёт. На высоте перехода режим меняется на выдерживание M. Эта высота не зависит от температуры: приборная скорость и число M связаны только через давление.</p></div>`,
 quiz:QZ},
 mount:{flight(el){bind(el,()=>{const [cas,M,fl]=vals(el,['c1','c2','c3']);out(el,'c1',f(cas));out(el,'c2',f(M,2));out(el,'c3',`FL${fl}`);
  const h=fl*100*FT,c=ISA.CAS(M,ISA.P(h))/ISA.KT,ok=ISA.CAS(M,ISA.P0)/ISA.KT>cas,xo=FP.invert(x=>ISA.CAS(M,ISA.P(x))/ISA.KT,cas,0,15000);
  el.querySelector('[data-c]').innerHTML=ro('hl','Высота перехода на M',ok?FP.fl(xo):'нет',ok?`${f(xo)} м`:'M не достигается')+ro('','Приборная скорость на эшелоне',`${f(c)} kt`,`при M ${f(M,2)}`)+ro('','Истинная скорость на эшелоне',`${f(M*Math.sqrt(ISA.K*ISA.R*ISA.T(h))/ISA.KT)} kt`,'в СА')})}},
 quiz:[['При той же приборной скорости в жару истинная скорость отрыва:',['больше','меньше','такая же','равна нулю'],'Плотность меньше, V = Vпр·√(ρ₀/ρ).'],
  ['Высота перехода с приборной скорости на число M зависит от:',['давления (высоты), но не от температуры','только от температуры','от влажности','от веса ВС'],'CAS и M связаны через давление.']]};

/* ---------- 2.5 ---------- */
const STEPS=[[String.raw`\(dp = -\rho g\,dH\)`,'Уравнение статики: давление убывает с высотой на вес столба воздуха единичного сечения высотой dH.','<b>Пилоту:</b> чем плотнее воздух, тем быстрее падает давление с высотой.'],
 [String.raw`\(\rho = \dfrac{p}{RT}\)`,'Уравнение состояния для сухого воздуха, R = 287,05 Дж/(кг·K).','<b>Пилоту:</b> плотность падает с ростом температуры.'],
 [String.raw`\(\dfrac{dp}{p} = -\dfrac{g}{RT}\,dH\)`,'Подставляем плотность в уравнение статики и разделяем переменные.','Относительное изменение давления зависит только от температуры.'],
 [String.raw`\(T = T_0 - \beta H\)`,'Закон изменения температуры в тропосфере СА, β = 0,0065 K/м.','<b>Пилоту:</b> около 2 °C на 1000 ft.'],
 [String.raw`\(\ln\dfrac{p}{p_0} = \dfrac{g}{R\beta}\ln\dfrac{T_0 - \beta H}{T_0}\)`,'Интегрируем от уровня моря до высоты H.','Оба логарифма при H > 0 отрицательны.'],
 [String.raw`\(p = p_0\left(1 - \dfrac{\beta H}{T_0}\right)^{g/R\beta},\quad \dfrac{g}{R\beta} \approx 5{,}256\)`,'Барометрическая формула для тропосферы. По ней тарирована шкала высотомера.','<b>Проверка:</b> на 5500 м давление около 505 гПа.'],
 [String.raw`\(p = p_{11}\exp\left(-\dfrac{g\,(H - 11\,000)}{R\,T_{11}}\right)\)`,'Изотермический слой 11–20 км, T₁₁ = 216,65 K, p₁₁ = 226,3 гПа.','Здесь летают магистральные ВС.'],
 [String.raw`\(h = -\dfrac{dH}{dp} = \dfrac{RT}{g\,p} \approx 8{,}3\ \text{м/гПа}\)`,'Барическая ступень – высота, на которой давление меняется на 1 гПа. У земли в СА 8,3 м/гПа (около 27 ft/гПа), с высотой и температурой растёт.','<b>Пилоту:</b> ошибка установки давления на 10 гПа даёт у земли ошибку высоты около 83 м.']];
const s25={id:'s25',n:'2.5',title:'Барометрические формулы и барометрическая высота',short:'Барометрическая высота',h1:'Барометрическая <em class="acc">высота</em>',
 rpd:'Раздел 2 «Физические характеристики атмосферы»',f:String.raw`\(p = p_0\left(1 - \dfrac{\beta H}{T_0}\right)^{5{,}256}\)`,
 tabs:{theory:`<p class="lead">Давление с высотой убывает тем быстрее, чем плотнее и холоднее воздух. Барометрический высотомер измеряет давление и переводит его в высоту по формуле СА.</p>
  <div class="glass pad"><div class="row" style="justify-content:space-between"><h3 class="h">Вывод барометрической формулы</h3><div class="row"><button class="btn" data-all type="button">Показать все</button><button class="btn lime" data-next type="button">Следующий шаг</button></div></div><div class="steps" data-steps></div></div>
  <div class="cols"><div class="glass pad"><h3 class="h">QFE, QNH, QNE, QFF</h3><div class="prose"><p><b>QFE</b> – давление на уровне порога ВПП. Высотомер показывает высоту над аэродромом.</p><p><b>QNH</b> – давление, приведённое к уровню моря по СА. Высотомер показывает высоту над уровнем моря (на земле – превышение аэродрома).</p><p><b>QNE</b> – стандартная установка 1013,25 гПа, полёт по эшелонам.</p><p><b>QFF</b> – давление, приведённое к уровню моря по фактической температуре; используется на картах погоды.</p></div></div>
  <div class="glass pad"><h3 class="h">Суточный и годовой ход давления</h3><div class="prose"><p>В тропиках хорошо выражен суточный ход давления с двумя максимумами и двумя минимумами в сутки. В умеренных широтах он маскируется изменениями давления при прохождении циклонов и антициклонов, поэтому QNH меняется в течение дня, и экипаж получает его перед вылетом и при заходе на посадку.</p></div></div></div>`,
 model:`<div class="glass pad"><div class="ctrls">${slider('a1','QNH аэродрома, гПа',960,1050,1,998)}${slider('a2','Превышение аэродрома, м',0,1500,1,24)}${slider('a3','Температура у земли, °C',-45,40,1,-25)}${slider('a4','Высотомер по QNH, м',0,3000,10,600)}</div></div>
  <div class="cols"><div class="glass pad"><h3 class="h">Уровни отсчёта</h3><svg class="chart" data-svg viewBox="0 0 340 300"></svg></div><div class="glass pad"><h3 class="h">Показания при разных установках</h3><div class="tbl"><table data-tbl></table></div><div class="callout" data-msg style="margin-top:14px"></div></div></div>`,
 flight:`<div class="glass pad case"><h3 class="h">Перелёт без перестановки давления</h3><p class="note" style="margin:.3em 0 12px">Высотомер настроен на QNH аэродрома вылета, экипаж выдерживает постоянное показание, а давление по маршруту меняется.</p>
  <div class="ctrls">${slider('r1','QNH вылета, гПа',970,1040,1,1022)}${slider('r2','QNH назначения, гПа',970,1040,1,1002)}${slider('r3','Выдерживаемая высота, м',300,3000,50,900)}</div><div class="ro-grid" data-r style="margin-top:16px"></div>
  <p class="note" style="margin-top:10px">Правило: «из высокого в низкое – смотри вниз». Холод действует так же: изобары сближаются, и истинная высота меньше приборной.</p></div>
  <div class="glass pad case jet"><h3 class="h">Высота и эшелон перехода</h3><div class="ctrls" style="margin-top:12px">${slider('t1','Высота перехода, ft',3000,18000,500,5000)}${slider('t2','QNH, гПа',960,1050,1,1013)}${slider('t3','Минимальный слой перехода, ft',0,2000,100,1000)}</div><div class="ro-grid" data-t style="margin-top:16px"></div>
  <p class="note" style="margin-top:10px">Эшелон перехода – наименьший эшелон, лежащий выше высоты перехода не меньше чем на слой перехода (шаг 1000 ft). При низком давлении эшелон перехода поднимается. Значения для аэродрома берутся из сборника аэронавигационной информации.</p></div>`,
 quiz:QZ},
 mount:{theory(el){let n=1;const host=el.querySelector('[data-steps]'),nx=el.querySelector('[data-next]');
   const draw=()=>{host.innerHTML=STEPS.slice(0,n).map((s,i)=>`<div class="step${i===n-1&&n>1?' new':''}"><div class="k">${String(i+1).padStart(2,'0')}</div><div><div class="f">${s[0]}</div><div>${s[1]}</div><div class="why">${s[2]}</div></div></div>`).join('');nx.disabled=n>=STEPS.length;nx.textContent=n>=STEPS.length?'Вывод завершён':`Шаг ${n+1} из ${STEPS.length}`;FP.typeset(host)};
   nx.onclick=()=>{n=Math.min(STEPS.length,n+1);draw()};el.querySelector('[data-all]').onclick=()=>{n=STEPS.length;draw()};draw()},
  model(el){bind(el,()=>{const [qnh,e,t,ind]=vals(el,['a1','a2','a3','a4']);out(el,'a1',f(qnh));out(el,'a2',f(e));out(el,'a3',sg(t));out(el,'a4',f(ind));
