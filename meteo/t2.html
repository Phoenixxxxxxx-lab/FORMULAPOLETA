<style>
.bar-types{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}

<body>
<script>
(function(){
const {f,sg,ro,ISA,slider,vals,out,bind}=FP; const FT=ISA.FT;
const QZ='<div class="quiz quiz-host"></div>';
const PLAIN=b=>`<div class="plain"><div class="kick">Простыми словами</div>${b}</div>`;
const stub=(title,items)=>`<div class="stub"><div class="kick">Раздел в разработке</div><h3 class="h" style="margin-top:8px">${title}</h3><p style="margin:.3em 0 0">План содержания:</p><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
const E=t=>6.112*Math.exp(17.62*t/(243.12+t)); // давление насыщения над водой, гПа (формула Магнуса)
const seg=(el,sel,cb)=>{const g=el.querySelector(sel);g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));cb()});return ()=>g.querySelector('[aria-pressed=true]').dataset.v};

/* ---------- 2.1 ---------- */
const LZ=[0,500,1500,3000,5000];
const s21={id:'s21',n:'2.1',title:'Параметры атмосферы',h1:'Температура, влажность, <em class="acc">давление,</em> плотность',
 rpd:'Раздел 2 «Физические характеристики атмосферы»',f:String.raw`\(f = \dfrac{e}{E}\cdot 100\,\%\)`,
 tabs:{theory:String.raw`<p class="lead">Состояние атмосферы в точке описывают четыре основных параметра: температура, влажность, давление и плотность. Температура, давление и плотность связаны уравнением состояния, а влажность определяет, когда начнётся конденсация водяного пара.</p>
 <div class="cols"><div class="glass pad"><h3 class="h">Температура воздуха</h3><div class="prose">
  <p><b>Температура воздуха</b> – характеристика теплового состояния атмосферы, обусловленная кинетической энергией движения молекул газов, входящих в состав воздуха; один из термодинамических параметров состояния атмосферы.</p>
  <p>Измеряется по шкале Цельсия с точностью 0,1 °C, в сводках и на картах – в целых градусах. В расчётах – абсолютная шкала: \(T = t + 273{,}15\). Шкала Фаренгейта: \(t_F = 1{,}8\,t + 32\).</p>
  <p><b>Тепловой режим атмосферы</b> – распределение температуры в пространстве и её изменение во времени. Он формируется теплообменом с подстилающей поверхностью (турбулентная теплопроводность, конвекция, лучистый теплообмен), адиабатическими процессами при вертикальных движениях и адвекцией – горизонтальным переносом тёплого или холодного воздуха.</p></div></div>
 <div class="glass pad"><h3 class="h">Изменение температуры во времени и с высотой</h3><div class="prose">
  <p>Суша нагревается и остывает быстро, вода – медленно: удельная теплоёмкость воды в 3–4 раза больше, чем почвы. Поэтому суточные и годовые колебания температуры над сушей значительно больше. Минимум в суточном ходе бывает около восхода Солнца, максимум – в 14–15 ч местного времени.</p>
  <p><b>Вертикальный градиент температуры</b> – изменение температуры на 100 м высоты:</p>
  <p>\[\gamma = -\dfrac{\Delta T}{\Delta H}\cdot 100\ \ {}^\circ\text{C}/100\ \text{м}\]</p>
  <p>\(\gamma > 0\) – температура падает с высотой; \(\gamma = 0\) – <b>изотермия</b>; \(\gamma < 0\) – <b>инверсия</b>. График распределения температуры по высоте по данным зондирования называют <b>кривой стратификации</b>.</p></div></div></div>
 <div class="cols"><div class="glass pad"><h3 class="h">Давление и плотность</h3><div class="prose">
  <p><b>Атмосферное давление</b> – сила, действующая со стороны атмосферы на единицу площади; численно равно весу столба воздуха единичного сечения до верхней границы атмосферы. Единицы: 1 гПа = 1 мбар = 100 Па, 1 мм рт. ст. = 1,333 гПа, 760 мм рт. ст. = 1013,25 гПа. В ряде стран – дюймы ртутного столба (inHg).</p>
  <p><b>Плотность</b> – масса единицы объёма воздуха, кг/м³. Непосредственно не измеряется, а вычисляется из уравнения состояния: \(\rho = \dfrac{p}{RT}\). Плотность тем больше, чем выше давление и ниже температура.</p></div></div>
 <div class="glass pad"><h3 class="h">Характеристики влажности</h3><div class="prose">
  <p>\(e\) – <b>упругость водяного пара</b> (его парциальное давление), гПа; \(E\) – упругость насыщения, зависит только от температуры.</p>
  <p>\(f = e/E\cdot100\,\%\) – <b>относительная влажность</b>; \(s \approx 622\,e/p\) – <b>удельная влажность</b>, г/кг; \(a\) – <b>абсолютная влажность</b>, г/м³.</p>
  <p>\(T_d\) – <b>точка росы</b>: температура, до которой нужно охладить воздух при неизменных давлении и влагосодержании, чтобы он стал насыщенным. \(\Delta = t - T_d\) – <b>дефицит точки росы</b>.</p>
  <p>Удельная влажность не меняется при нагревании, охлаждении, расширении и сжатии воздуха, если нет конденсации или испарения.</p></div></div></div>
 ${PLAIN(`<p>Обычно при подъёме становится холоднее – примерно на 6–7 °C на каждый километр. Но бывают слои, где температура не меняется или даже растёт. Такой слой работает как «крышка»: под ним скапливаются дымка, туман и низкие облака.</p><p>Тёплый воздух может удержать больше пара, чем холодный. Главная цифра влажности для пилота – разница между температурой и точкой росы: чем она меньше, тем ближе туман и низкая облачность.</p>`)}`,
 model:`<div class="glass pad"><h3 class="h">Влажность воздуха</h3><div class="ctrls">${slider('h1','Температура воздуха t',-30,40,0.5,12)}${slider('h2','Точка росы Td',-35,40,0.5,8)}${slider('h3','Давление',900,1050,1,1013)}</div></div><div class="ro-grid" data-ro></div><div class="callout" data-msg></div>
  <p class="note">Давление насыщения рассчитано по формуле Магнуса над водой: \\(E = 6{,}112\\,\\exp\\dfrac{17{,}62\\,t}{243{,}12 + t}\\) гПа.</p>
  <div class="glass pad"><h3 class="h">Кривая стратификации</h3><div class="ctrls">${slider('g0','t у земли, °C',-30,35,1,5)}${slider('g1','γ в слое 0–500 м',-1.5,1.2,0.05,-0.8)}${slider('g2','γ в слое 500–1500 м',-1.5,1.2,0.05,0.6)}${slider('g3','γ в слое 1500–3000 м',-1.5,1.2,0.05,0)}${slider('g4','γ в слое 3000–5000 м',-1.5,1.2,0.05,0.65)}</div>
   <svg class="chart" id="ch21" viewBox="0 0 340 270" role="img" aria-label="Кривая стратификации"></svg>
   <div class="legend"><span><i style="border-color:var(--lime-line)"></i>кривая стратификации</span><span><i style="border-color:var(--chart-2);border-top-style:dashed"></i>градиент СА</span></div>
   <p class="note" style="margin-top:8px">Слои инверсии подсвечены. Исходный пример – ясная зимняя ночь: приземная инверсия, выше изотермия.</p></div>`,
 flight:`<div class="glass pad case"><h3 class="h">Температура и точка росы в сводке</h3><div class="prose"><p>В сводке METAR температура и точка росы идут одной группой: <span class="mono">12/08</span> означает t = +12 °C, Td = +8 °C. Отрицательные значения обозначают буквой M: <span class="mono">M02/M05</span>.</p><p>Перед вылетом на DA 40 NG экипаж смотрит на дефицит точки росы, особенно вечером и ночью: при ясном небе и слабом ветре воздух у земли выхолаживается, и при малом дефиците возможен радиационный туман.</p><p>На PFD G1000 температура наружного воздуха выводится в окне OAT.</p></div></div>
  <div class="glass pad case"><h3 class="h">Набор высоты через инверсию</h3><div class="prose"><p>В слое инверсии плотность воздуха с высотой убывает быстрее обычного, поэтому мощность двигателя и скороподъёмность падают быстрее. Под инверсией скапливаются дымка и продукты конденсации – при заходе на посадку видимость под слоем инверсии может быть заметно хуже, чем над ним.</p></div></div>`,
 quiz:QZ},
 mount:{model(el){bind(el,()=>{let [t,td,p]=vals(el,['h1','h2','h3']);if(td>t){td=t;el.querySelector('#h2').value=t}
   out(el,'h1',`${sg(t,1)} °C`);out(el,'h2',`${sg(td,1)} °C`);out(el,'h3',`${f(p)} гПа / ${f(p/1.33322)} мм`);
   const Es=E(t),e=E(td),rh=e/Es*100,q=622*e/(p-0.378*e),a=e*100/(461.5*(t+273.15))*1000,rho=(p*100-0.378*e*100)/(ISA.R*(t+273.15));
   el.querySelector('[data-ro]').innerHTML=ro('hl','Относительная влажность',`${f(rh)} %`,`f = e / E`)+ro('','Упругость пара e',`${f(e,1)} гПа`,`насыщения E = ${f(Es,1)} гПа`)+ro('','Дефицит точки росы',`${f(t-td,1)} °C`,'t − Td')+ro('','Удельная влажность',`${f(q,1)} г/кг`,'масса пара в 1 кг воздуха')+ro('','Абсолютная влажность',`${f(a,1)} г/м³`,'масса пара в 1 м³')+ro('','Плотность влажного воздуха',f(rho,3),'кг/м³');
   const m=el.querySelector('[data-msg]'),d=t-td;m.className='callout'+(d<=2?' warn':'');
   m.innerHTML=d<=2?`<b>Воздух близок к насыщению.</b> При дефиците точки росы ${f(d,1)} °C небольшое охлаждение приведёт к конденсации: возможны туман, дымка, низкая облачность.`:`<b>Влажный воздух легче сухого.</b> Молекула воды легче молекул азота и кислорода, поэтому при той же температуре и давлении влажный воздух немного менее плотный.`;
   const [t0,...G]=vals(el,['g0','g1','g2','g3','g4']);out(el,'g0',sg(t0));G.forEach((g,i)=>out(el,'g'+(i+1),`${sg(g,2)} · ${g>0.01?'падение':g<-0.01?'инверсия':'изотермия'}`));
   const T=[t0];for(let i=0;i<4;i++)T.push(T[i]-G[i]*(LZ[i+1]-LZ[i])/100);
   const svg=el.querySelector('#ch21');FP.plot(svg,{x0:-60,x1:40,y0:0,y1:5,xt:[-60,-40,-20,0,20,40],yt:[0,1,2,3,4,5],xl:'t, °C',
    series:[{pts:LZ.map((z,i)=>[T[i],z/1000]),c:'var(--lime-line)'},{pts:[[t0,0],[t0-32.5,5]],c:'var(--chart-2)',dash:1}],marks:T.map((v,i)=>[v,LZ[i]/1000,'var(--lime-line)'])});
   const ml=46,pw=280,mt=12,ph=222,Y=y=>mt+ph-y/5*ph;let add='';
   G.forEach((g,i)=>{if(g<-0.01)add+=`<rect x="${ml}" width="${pw}" y="${Y(LZ[i+1]/1000)}" height="${Y(LZ[i]/1000)-Y(LZ[i+1]/1000)}" fill="var(--bad)" fill-opacity=".1"/><text x="${ml+pw-4}" y="${Y(LZ[i+1]/1000)+12}" text-anchor="end" style="fill:var(--bad)">инверсия</text>`;
    else if(Math.abs(g)<=0.01)add+=`<text x="${ml+pw-4}" y="${Y(LZ[i+1]/1000)+12}" text-anchor="end">изотермия</text>`});
   svg.insertAdjacentHTML('afterbegin',add)})}},
 quiz:[['Точка росы – это температура, при которой:',['водяной пар при неизменном содержании становится насыщенным','вода закипает','лёд начинает таять','относительная влажность равна нулю'],'При охлаждении до точки росы e = E, f = 100 %.'],
  ['Что такое инверсия температуры?',['слой, где температура растёт с высотой (γ < 0)','слой, где температура постоянна','быстрое падение температуры с высотой','суточный ход температуры'],'Слой с постоянной температурой – изотермия.'],
  ['Почему суточная амплитуда температуры над морем меньше, чем над сушей?',['теплоёмкость воды в 3–4 раза больше, тепло перемешивается на глубину','над морем всегда облачно','вода отражает всё излучение','над морем нет ветра'],'Вода медленно нагревается и медленно остывает.'],
  ['В METAR группа M03/M07 означает:',['t = −3 °C, Td = −7 °C','t = 3 °C, Td = 7 °C','видимость 3 км','ветер 3–7 м/с'],'Буква M обозначает отрицательное значение.'],
  ['1 мм рт. ст. равен:',['1,333 гПа','0,75 гПа','10 гПа','1 гПа'],'760 мм рт. ст. × 1,333 = 1013,25 гПа.'],
  ['Какая характеристика влажности не меняется при подъёме воздуха без конденсации?',['удельная влажность','относительная влажность','упругость насыщения','дефицит точки росы'],'Масса пара в 1 кг воздуха остаётся прежней.']]};

/* ---------- 2.2 Практика 01: аэрологическая диаграмма ---------- */
const AD_P=[1000,850,700,500,400,300,250,200,150,100];
const s22={id:'s22',n:'2.2',title:'Практика 01. Параметры СА по аэрологической диаграмме',short:'Практика 01',h1:'Практика 01. Параметры СА <em class="acc">по аэрологической</em> диаграмме',
 rpd:'Раздел 2 «Физические характеристики атмосферы», практическое занятие № 1',f:String.raw`\(\theta = T\left(\dfrac{1000}{p}\right)^{0{,}286}\)`,
 tabs:{theory:String.raw`<p class="lead"><b>Аэрологическая диаграмма</b> – термодинамический график, на котором по осям отложены температура и давление (в логарифмическом масштабе, поэтому ось давления близка к оси высот). На бланк нанесены изобары, изотермы, сухие и влажные адиабаты и линии массовой доли водяного пара. По диаграмме определяют параметры атмосферы на любом уровне, сравнивают фактическую стратификацию со стандартной и оценивают устойчивость.</p>
 <div class="cols"><div class="glass pad"><h3 class="h">Линии бланка</h3><div class="prose">
  <p><b>Изобары</b> – горизонтальные линии равного давления: 1000, 850, 700, 500, 400, 300, 200 гПа и выше.</p>
  <p><b>Изотермы</b> – линии равной температуры.</p>
  <p><b>Сухие адиабаты</b> – линии равной потенциальной температуры \(\theta\): по ним изменяется температура поднимающегося ненасыщенного воздуха, около 1 °C на 100 м.</p>
  <p><b>Кривая СА</b> – распределение температуры стандартной атмосферы: от +15 °C у 1013 гПа до −56,5 °C у 226 гПа (11 км), выше – изотерма.</p></div></div>
 <div class="glass pad"><h3 class="h">Порядок работы</h3><div class="prose">
  <p>1. Найти на диаграмме заданную изобару.</p><p>2. По пересечению изобары с кривой СА снять температуру.</p><p>3. По шкале высот (или по таблице СА) определить высоту изобарической поверхности в СА.</p><p>4. Сравнить с фактическим зондированием: разность температур на одном уровне – отклонение от СА.</p></div></div></div>
 ${PLAIN(`<p>Аэрологическая диаграмма – это «карта атмосферы по вертикали». Вверх идёт давление, которое заменяет высоту, вправо – температура. Нанёс на неё данные зонда – и видишь сразу, где теплее или холоднее стандарта и где будут облака.</p>`)}`,
 model:`<div class="col"><div class="glass pad"><h3 class="h">Упрощённый бланк</h3><svg class="chart" id="chAD" viewBox="0 0 360 400" role="img" aria-label="Аэрологическая диаграмма"></svg>
   <div class="legend"><span><i style="border-color:var(--lime-line)"></i>кривая СА</span><span><i style="border-color:var(--chart-2);border-top-style:dashed"></i>сухие адиабаты</span></div></div>
  <div style="display:grid;gap:16px"><div class="glass pad">${slider('ad1','Уровень (изобара), гПа',100,1000,5,700)}</div><div class="ro-grid" data-ro></div>
   <div class="glass pad"><div class="kick">Задача</div><p data-q style="margin:.5em 0 0"></p>

   for(let th=-30;th<=150;th+=10){let d='';for(let p=1050;p>=100;p-=10){const T=(th+273.15)*Math.pow(p/1000,0.286)-273.15;if(T<t0||T>t1)continue;d+=(d?'L':'M')+X(T).toFixed(1)+' '+Y(p).toFixed(1)}if(d)s+=`<path d="${d}" fill="none" stroke="var(--chart-2)" stroke-opacity=".35" stroke-dasharray="4 4"/>`}

  let z={};const q=el.querySelector('[data-q]'),r=el.querySelector('[data-r]'),iT=el.querySelector('#adT'),iH=el.querySelector('#adH');
  const nw=()=>{const P=[850,700,500,400,300,250,200][Math.floor(Math.random()*7)],H=ISA.Hp(P*100);z={P,H,T:ISA.T(H)-273.15};q.innerHTML=`Определите по диаграмме температуру и высоту изобарической поверхности <b>${P} гПа</b> в стандартной атмосфере.`;iT.value='';iH.value='';r.hidden=true};

   const okT=Math.abs(t-z.T)<=1.5,okH=Math.abs(h-z.H)<=150;r.className='callout'+(okT&&okH?'':' warn');

const s23={id:'s23',n:'2.3',title:'Методы и средства измерения',h1:'Методы и средства <em class="acc">измерения</em>',
 rpd:'Раздел 2 «Физические характеристики атмосферы»',
 tabs:{theory:`<p class="lead">Атмосферу исследуют <b>прямыми</b> и <b>косвенными</b> методами. Прямые – непосредственные (контактные) и дистанционные измерения приборами. Косвенные основаны на изучении явлений, по которым судят о состоянии атмосферы: оптических явлений, облачности, распространения звука и радиоволн, излучения, регистрируемого спутниками. Точность прямых методов для основных метеовеличин на порядок выше, чем косвенных, а непосредственных измерений – выше, чем дистанционных.</p>
 <div class="cols"><div class="glass pad"><h3 class="h">У Земли</h3><div class="prose">
  <p>В приземном слое преобладают прямые измерения на метеоплощадке и мачтах. <b>Температура</b> – термометры и термографы в метеобудке на высоте 2 м. <b>Влажность</b> – психрометры (стационарный и аспирационный), гигрометры, гигрографы. <b>Давление</b> – ртутный барометр, барометр-анероид, барограф. <b>Ветер</b> – флюгер, анемометр, анеморумбометр, анеморумбограф.</p>
  <p>На аэродроме к ним добавляются измерители высоты облаков и регистраторы дальности видимости у порогов ВПП, объединённые в автоматизированную метеорологическую систему.</p></div></div>
 <div class="glass pad"><h3 class="h">По высотам</h3><div class="prose">
  <p>В свободной атмосфере наряду с прямыми широко применяют дистанционные и косвенные методы. <b>Радиозонд</b> измеряет давление, температуру и влажность; по его координатам рассчитывают ветер. <b>Шар-пилот</b> с теодолитом даёт ветер только до нижней границы облаков, <b>радиопилот</b> с радиолокационной метеостанцией – в любых условиях.</p>
  <p><b>Метеорадиолокаторы</b> обнаруживают облака, осадки и грозы, <b>метеоспутники</b> дают снимки облачности и профили температуры, самолёты передают данные бортовых измерений.</p></div></div></div>
 ${PLAIN(`<p>У земли погоду «трогают руками»: термометр, барометр, флюгер. Наверху так не получится, поэтому туда отправляют зонд на шаре, а остальное «видят издалека» – радаром и спутником.</p>`)}`,

  ['Каким методом измеряют влажность воздуха у земли?',['психрометрическим – по разности сухого и смоченного термометров','по времени отражения лазерного импульса','по ослаблению светового потока','по углу отклонения доски флюгера'],'Психрометр – два термометра, один со смоченным резервуаром.'],
  ['Чем определяют ветер на высотах в любых метеоусловиях?',['радиопилотом или радиозондом с радиолокационной станцией','шаром-пилотом с теодолитом','флюгером','барографом'],'Шар-пилот с теодолитом виден только до нижней границы облаков.'],
  ['Какие методы точнее для основных метеовеличин?',['прямые','косвенные','спутниковые','одинаково точные'],'Прямые методы точнее косвенных на порядок.']]};

const s24={id:'s24',n:'2.4',title:'Изменчивость параметров и влияние на полёт',short:'Влияние на полёт',h1:'Изменчивость параметров <em class="acc">и</em> полёт ВС',
 rpd:'Раздел 2 «Физические характеристики атмосферы»',f:String.raw`\(V = \sqrt{\dfrac{2G}{C_y\,\rho\,S}}\)`,
 tabs:{theory:String.raw`<p class="lead">Температура, давление и плотность меняются в пространстве и во времени: с высотой, по сезонам, в течение суток и при смене воздушных масс. Поэтому взлётно-посадочные характеристики, скороподъёмность, потолок и режим на эшелоне каждый раз разные.</p>
 <div class="cols"><div class="glass pad"><h3 class="h">Аэродинамические силы и плотность</h3><div class="prose">
  <p>Подъёмная сила и лобовое сопротивление прямо пропорциональны плотности воздуха:</p>
  <p>\[Y = C_y\dfrac{\rho V^2}{2}S,\qquad X = C_x\dfrac{\rho V^2}{2}S\]</p>
  <p>Отсюда потребная скорость горизонтального полёта и скорость отрыва обратно пропорциональны \(\sqrt{\rho}\). С учётом \(\rho = p/(RT)\) они растут с ростом температуры и падением давления:</p>
  <p>\[V_{отр} = \sqrt{\dfrac{2G\,R\,T}{C_{y\,отр}\,S\,p}}\]</p></div></div>
 <div class="glass pad"><h3 class="h">Взлёт и посадка</h3><div class="prose">
  <p>Для большинства реактивных самолётов при неизменных оборотах повышение температуры на 10 °C относительно стандартной увеличивает длину разбега примерно на 13 %, понижение на 10 °C – уменьшает примерно на 10 %. Отклонение на 10 °C изменяет длину пробега примерно на 3,5 %.</p>
  <p>Это особенно важно на ВПП ограниченной длины, при максимальной загрузке и летом на горных аэродромах.</p></div></div></div>
 <div class="cols"><div class="glass pad"><h3 class="h">Тяга, скороподъёмность, потолок</h3><div class="prose">
  <p>Располагаемая тяга ТРД пропорциональна массовому расходу воздуха через двигатель и падает при повышении температуры и понижении давления. На постоянной барометрической высоте тяга зависит только от температуры. В слоях инверсии и изотермии и при пересечении тропопаузы плотность с высотой убывает быстрее, и тяга падает быстрее.</p>
  <p>При отклонении +10 °C максимальная вертикальная скорость на 10–20 % меньше стандартной. Изменение потолка оценивают как \(\Delta H = k\,\Delta T\), \(k \approx 50\) м/°C: в тёплом воздухе потолок ниже, в холодном – выше.</p></div></div>
 <div class="glass pad"><h3 class="h">Скорость на эшелоне</h3><div class="prose">
  <p>Истинная скорость связана с индикаторной через относительную плотность \(\Delta = \rho/\rho_0\): \(V = V_i/\sqrt{\Delta}\). На высотах 8–10 км истинная скорость может превышать индикаторную на 50–70 % и более.</p>
  <p>Скорость звука зависит только от температуры: \(a = 20{,}05\sqrt{T}\) м/с. Поэтому предельная скорость по числу M меняется с температурой: при \(M_{пр} = 0{,}82\) у земли при +28 °C \(V_{пр} \approx 1024\) км/ч, на 12 км при −48 °C – около 886 км/ч. При понижении температуры на 5 °C максимальная скорость горизонтального полёта растёт примерно на 1 %.</p></div></div></div>
 ${PLAIN(`<p>Крылу и двигателю нужен не «воздух вообще», а масса воздуха. В жару и на высоте её меньше: чтобы получить ту же подъёмную силу, приходится разгоняться быстрее и дольше, а двигатель тянет слабее. Отсюда длинный разбег, вялый набор и низкий потолок жарким летом. Зимой – наоборот.</p>`)}`,
 model:`<div class="glass pad"><h3 class="h">Взлёт и посадка</h3><div class="ctrls">${slider('v1','Превышение аэродрома, м',0,2500,10,0)}${slider('v2','QNH, гПа',960,1050,1,1013)}${slider('v3','Температура на аэродроме, °C',-40,45,1,35)}</div></div><div class="ro-grid" data-a></div>

 flight:`<div class="glass pad case jet"><div class="row" style="justify-content:space-between"><h3 class="h">SSJ 100 в наборе</h3><span class="kick">переход с приборной скорости на число M</span></div>

  const qfe=ISA.P(ISA.Hp(q*100)+e),T=t+273.15,dA=T-ISA.T(ISA.Hp(qfe)),vr=Math.sqrt((T/qfe)/(ISA.T0/ISA.P0)),lr=dA>=0?1.3*dA:1.0*dA,lp=0.35*dA;

  flight(el){bind(el,()=>{const [cas,M,fl]=vals(el,['c1','c2','c3']);out(el,'c1',f(cas));out(el,'c2',f(M,2));out(el,'c3',`FL${fl}`);

  el.querySelector('[data-c]').innerHTML=ro('hl','Высота перехода на M',ok?FP.fl(xo):'нет',ok?`${f(xo)} м`:'M не достигается')+ro('','Приборная скорость на эшелоне',`${f(c)} kt`,`при M ${f(M,2)}`)+ro('','Истинная скорость на эшелоне',`${f(M*Math.sqrt(ISA.K*ISA.R*ISA.T(h))/ISA.KT)} kt`,'в СА')})}},

const STEPS=[[String.raw`\(dp = -\rho g\,dH\)`,'Основное уравнение статики атмосферы: давление убывает с высотой на вес столба воздуха единичного сечения высотой dH. Оно выражает равновесие вертикальной составляющей силы барического градиента и силы тяжести.','<b>Пилоту:</b> чем плотнее воздух, тем быстрее падает давление с высотой.'],
 [String.raw`\(\rho = \dfrac{p}{RT}\)`,'Уравнение состояния для сухого воздуха, R = 287,05 Дж/(кг·K).','<b>Пилоту:</b> плотность падает с ростом температуры.'],
 [String.raw`\(\dfrac{dp}{p} = -\dfrac{g}{RT}\,dH\)`,'Подставляем плотность в уравнение статики и разделяем переменные.','В холодном воздухе давление с высотой убывает быстрее, чем в тёплом.'],
 [String.raw`\(p = p_0\,e^{-\frac{gH}{R\,T_{ср}}}\)`,'Интегрирование при средней температуре слоя даёт общую (экспоненциальную) барометрическую формулу.','Отсюда практические формулы Лапласа и Бабине.'],
 [String.raw`\(T = T_0 - \beta H\)`,'Закон изменения температуры в тропосфере СА, β = 0,0065 K/м.','<b>Пилоту:</b> около 2 °C на 1000 ft.'],
 [String.raw`\(p = p_0\left(1 - \dfrac{\beta H}{T_0}\right)^{g/R\beta},\quad \dfrac{g}{R\beta} \approx 5{,}256\)`,'Барометрическая формула для тропосферы СА. По ней тарирована шкала высотомера.','<b>Проверка:</b> на 5500 м давление около 505 гПа.'],
 [String.raw`\(p = p_{11}\exp\left(-\dfrac{g\,(H - 11\,000)}{R\,T_{11}}\right)\)`,'Изотермический слой 11–20 км, T₁₁ = 216,65 K, p₁₁ = 226,3 гПа.','Здесь летают магистральные ВС.'],
 [String.raw`\(h = \dfrac{RT}{g\,p} \approx \dfrac{8000\,(1 + \alpha t)}{p}\ \text{м/гПа}\)`,'Барическая ступень – высота, на которую надо подняться, чтобы давление понизилось на 1 гПа; α = 1/273. У уровня моря при 0 °C около 8 м/гПа, на 5 км – около 15 м/гПа. С ростом температуры на 1 °C увеличивается на 0,4 %.','<b>Пилоту:</b> у земли в СА 8,3 м/гПа (около 27 ft/гПа). Ошибка установки давления на 10 гПа даёт ошибку высоты около 83 м.']];
const s25={id:'s25',n:'2.5',title:'Барометрические формулы и барометрическая высота',short:'Барометрическая высота',h1:'Барометрическая <em class="acc">высота</em>',
 rpd:'Раздел 2 «Физические характеристики атмосферы»',f:String.raw`\(p = p_0\left(1 - \dfrac{\beta H}{T_0}\right)^{5{,}256}\)`,
 tabs:{theory:String.raw`<p class="lead">Давление с высотой убывает тем быстрее, чем плотнее и холоднее воздух. Эту связь выражает основное уравнение статики атмосферы, а его интегралы – барометрические формулы. Барометрический высотомер измеряет давление и переводит его в высоту по формуле СА.</p>
  <div class="glass pad"><div class="row" style="justify-content:space-between"><h3 class="h">Вывод барометрической формулы</h3><div class="row"><button class="btn" data-all type="button">Показать все</button><button class="btn lime" data-next type="button">Следующий шаг</button></div></div><div class="steps" data-steps></div></div>
  <div class="cols"><div class="glass pad"><h3 class="h">Барометрическое нивелирование</h3><div class="prose"><p>Барометрические формулы применяют для определения разности высот двух точек по разности давления, для приведения давления к уровню моря и пересчёта показаний статоскопа.</p>
   <p>Формула Бабине (разность высот до 1000 м):</p><p>\[H = 16\,000\,(1 + \alpha t_{ср})\,\dfrac{p_0 - p_H}{p_0 + p_H}\]</p>
   <p>Формула Лапласа (вся тропосфера):</p><p>\[H = 18\,400\,(1 + \alpha t_{ср})\,\lg\dfrac{p_0}{p_H}\]</p></div></div>
  <div class="glass pad"><h3 class="h">QFE, QNH, QNE, QFF</h3><div class="prose"><p><b>QFE</b> – давление на уровне порога ВПП. Высотомер показывает высоту над аэродромом, на земле – ноль.</p><p><b>QNH</b> – давление, приведённое к уровню моря по СА. Высотомер показывает высоту над уровнем моря (на земле – превышение аэродрома).</p><p><b>QNE</b> – стандартная установка 1013,25 гПа (760 мм рт. ст.), полёт по эшелонам; высотомер показывает барометрическую высоту.</p><p><b>QFF</b> – давление, приведённое к уровню моря по фактической температуре; используется на картах погоды.</p></div></div></div>
  <div class="cols"><div class="glass pad"><h3 class="h">Барическая тенденция</h3><div class="prose"><p>Изменение давления на уровне станции за последние 3 ч. Описывается величиной (гПа за 3 ч, с точностью 0,1 гПа) и характеристикой – видом кривой на ленте барографа за тот же срок.</p></div></div>
  <div class="glass pad"><h3 class="h">Суточный и годовой ход давления</h3><div class="prose"><p>В тропиках хорошо выражен суточный ход давления с двумя максимумами и двумя минимумами в сутки. В умеренных широтах он маскируется изменениями давления при прохождении циклонов и антициклонов, поэтому QNH меняется в течение дня, и экипаж получает его перед вылетом и при заходе на посадку.</p></div></div></div>
  ${PLAIN(`<p>Давление – это вес воздуха над Вами. Поднялись – воздуха сверху меньше, давление ниже. У земли каждые 8 м подъёма «снимают» 1 гПа.</p><p>Холодный воздух тяжелее, поэтому в нём давление с высотой падает быстрее, и одно и то же давление в холоде лежит ниже, чем в тепле. Высотомер этого «не знает» – отсюда главная его ошибка.</p>`)}`,

  <div class="cols"><div class="glass pad"><h3 class="h">Уровни отсчёта</h3><svg class="chart" data-svg viewBox="0 0 340 300"></svg></div><div class="glass pad"><h3 class="h">Показания при разных установках</h3><div class="tbl"><table data-tbl></table></div><div class="callout" data-msg style="margin-top:14px"></div></div></div>
  <div class="glass pad"><h3 class="h">Тёплый и холодный столб воздуха</h3><div class="ctrls">${slider('k1','t у земли, столб А, °C',-30,35,1,-20)}${slider('k2','t у земли, столб Б, °C',-30,35,1,25)}</div>

   <p class="note" style="margin-top:8px">У земли в обоих столбах 1000 гПа, градиент 0,65 °C/100 м. Чем больше разность температур, тем сильнее наклон изобарических поверхностей и горизонтальный барический градиент на высоте – от тёплого воздуха к холодному.</p></div><div class="ro-grid" data-k></div>
  <div class="glass pad"><h3 class="h">Барометрическое нивелирование</h3><div class="ctrls">${slider('n1','Давление на нижнем уровне, гПа',950,1040,0.5,1013)}${slider('n2','Давление на верхнем уровне, гПа',500,1030,0.5,900)}${slider('n3','Средняя температура слоя, °C',-40,35,1,5)}</div></div><div class="ro-grid" data-n></div>`,
 flight:`<div class="glass pad case"><h3 class="h">Перелёт без перестановки давления</h3><p class="note" style="margin:.3em 0 12px">Высотомер настроен на QNH аэродрома вылета, экипаж выдерживает постоянное показание, а давление по маршруту меняется.</p>
  <div class="ctrls">${slider('r1','QNH вылета, гПа',970,1040,1,1022)}${slider('r2','QNH назначения, гПа',970,1040,1,1002)}${slider('r3','Выдерживаемая высота, м',300,3000,50,900)}</div><div class="ro-grid" data-r style="margin-top:16px"></div>
  <p class="note" style="margin-top:10px">Правило: «из высокого в низкое – смотри вниз». Холод действует так же: изобары сближаются, и истинная высота меньше приборной.</p></div>
  <div class="glass pad case jet"><h3 class="h">Высота и эшелон перехода</h3><div class="ctrls" style="margin-top:12px">${slider('t1','Высота перехода, ft',3000,18000,500,5000)}${slider('t2','QNH, гПа',960,1050,1,1013)}${slider('t3','Минимальный слой перехода, ft',0,2000,100,1000)}</div><div class="ro-grid" data-t style="margin-top:16px"></div>
  <p class="note" style="margin-top:10px">Эшелон перехода – наименьший эшелон, лежащий выше высоты перехода не меньше чем на слой перехода (шаг 1000 ft). При низком давлении эшелон перехода поднимается. Значения для аэродрома берутся из сборника аэронавигационной информации.</p></div>`,

 mount:{theory(el){let n=1;const host=el.querySelector('[data-steps]'),nx=el.querySelector('[data-next]');
   const draw=()=>{host.innerHTML=STEPS.slice(0,n).map((s,i)=>`<div class="step${i===n-1&&n>1?' new':''}"><div class="k">${String(i+1).padStart(2,'0')}</div><div><div class="f">${s[0]}</div><div>${s[1]}</div><div class="why">${s[2]}</div></div></div>`).join('');nx.disabled=n>=STEPS.length;nx.textContent=n>=STEPS.length?'Вывод завершён':`Шаг ${n+1} из ${STEPS.length}`;FP.typeset(host)};
   nx.onclick=()=>{n=Math.min(STEPS.length,n+1);draw()};el.querySelector('[data-all]').onclick=()=>{n=STEPS.length;draw()};draw()},

   const hQ=ISA.Hp(qnh*100),qfe=ISA.P(hQ+e)/100,std=hQ+ind,hA=Math.max(0,ind-e),Tm=273.15+t-ISA.L*hA/2,TmI=ISA.T0-ISA.L*(e+hA/2),tr=e+hA*Tm/TmI,err=tr-Math.max(ind,e);
   el.querySelector('[data-tbl]').innerHTML='<thead><tr><th>Установка</th><th>Давление</th><th>Показание</th></tr></thead><tbody>'+`<tr><td>QNE</td><td>1013,25 гПа</td><td>${f(std)} м, ${FP.fl(std)}</td></tr><tr><td>QNH</td><td>${f(qnh)} гПа</td><td>${f(ind)} м</td></tr><tr><td>QFE</td><td>${f(qfe,1)} гПа, ${f(qfe*0.750062)} мм</td><td>${f(ind-e)} м</td></tr><tr class="hl"><td>Истинная высота</td><td>t = ${sg(t)} °C</td><td>${f(tr)} м</td></tr></tbody>`;
   const m=el.querySelector('[data-msg]');m.className='callout'+(err<0?' warn':'');
   m.innerHTML=hA<1?'ВС на земле: по QFE высотомер показывает 0, по QNH – превышение аэродрома.':`<b>${err<0?'Истинная высота ниже приборной':'Истинная высота выше приборной'} на ${f(Math.abs(err))} м (${f(Math.abs(err)/FT)} ft).</b> ${err<0?'Холодный воздух плотнее, изобары лежат ниже. К минимальным высотам вводят температурную поправку.':'В тёплом воздухе изобары расходятся.'} Средняя температура слоя ${f(Tm-273.15,1)} °C, в СА ${f(TmI-273.15,1)} °C.`;

   const st=t=>8000*(1+t/273)/1000;el.querySelector('[data-k]').innerHTML=ro('','Барическая ступень у земли, А',`${f(st(ta),2)} м/гПа`,'8000(1 + αt)/p')+ro('','Барическая ступень у земли, Б',`${f(st(tb),2)} м/гПа`,'')+ro('hl','Разность высот 500 гПа',`${f(Math.abs(zOf(tb,500)-zOf(ta,500)))} м`,'между столбами');
   /* нивелирование */
   let [p0,p1,tm]=vals(el,['n1','n2','n3']);if(p1>=p0){p1=p0-0.5;el.querySelector('#n2').value=p1}out(el,'n1',f(p0,1));out(el,'n2',f(p1,1));out(el,'n3',sg(tm));
   const kk=1+tm/273,hb=16000*kk*(p0-p1)/(p0+p1),hl=18400*kk*Math.log10(p0/p1);
   el.querySelector('[data-n]').innerHTML=ro('','По формуле Бабине',`${f(hb)} м`,'для ΔH до 1000 м')+ro('hl','По формуле Лапласа',`${f(hl)} м`,'для всей тропосферы')+ro(Math.abs(hb-hl)/hl>0.01?'warn':'','Расхождение',`${f(Math.abs(hb-hl))} м`,`${f(Math.abs(hb-hl)/hl*100,1)} %`)})},
  flight(el){bind(el,()=>{const [q1,q2,h]=vals(el,['r1','r2','r3']);out(el,'r1',f(q1));out(el,'r2',f(q2));out(el,'r3',f(h));const dz=ISA.Hp(q2*100)-ISA.Hp(q1*100);
   el.querySelector('[data-r]').innerHTML=ro('','Показание высотомера',`${f(h)} м`,`установка ${f(q1)} гПа`)+ro(dz>0?'warn':'hl','Истинная высота',`${f(h-dz)} м`,`${sg(-dz)} м к приборной`)+ro('','После посадки на уровне моря',`${sg(dz)} м`,'вместо 0 без перестановки');
   const [ta,q,b]=vals(el,['t1','t2','t3']);out(el,'t1',f(ta));out(el,'t2',f(q));out(el,'t3',f(b));const off=ISA.Hp(q*100)/FT;let tl=0;for(let x=10;x<=300;x+=10){if(x*100-off>=ta+b){tl=x;break}}const alt=tl*100-off;
   el.querySelector('[data-t]').innerHTML=ro('','Поверхность 1013,25 гПа',`${sg(-off)} ft`,`${-off>=0?'выше':'ниже'} уровня моря`)+ro('hl','Эшелон перехода',`FL${String(tl).padStart(3,'0')}`,`по QNH ${f(alt)} ft`)+ro('','Слой перехода',`${f(alt-ta)} ft`,`${f((alt-ta)*FT)} м`)})}},

const s26={id:'s26',n:'2.6',title:'Основные формы барического поля',short:'Барическое поле',h1:'Формы <em class="acc">барического</em> поля',
 rpd:'Раздел 2 «Физические характеристики атмосферы»',f:String.raw`\(G = -\dfrac{\partial p}{\partial n}\)`,
 tabs:{theory:String.raw`<p class="lead"><b>Барическое поле</b> – распределение атмосферного давления в пространстве; поле скалярное. В пространстве его изображают изобарическими поверхностями, на картах – изобарами: линиями пересечения изобарических поверхностей с поверхностью уровня. На приземных картах изобары проводят через 5 гПа.</p>
 <div class="cols"><div class="glass pad"><h3 class="h">Изобарические поверхности</h3><div class="prose"><p>Изобарические поверхности наклонены к поверхности уровня под очень малыми углами – порядка угловых минут (тангенс 1/2000…1/10 000). В циклонах и над холодным воздухом они прогибаются вниз, в антициклонах и над тёплым воздухом – поднимаются.</p><p>Средние высоты: 1000 гПа – вблизи уровня моря, 850 гПа – около 1,5 км, 700 гПа – около 3 км, 500 гПа – около 5,5 км, 300 и 200 гПа – около 9 и 12 км, 100 гПа – около 16 км.</p></div></div>
 <div class="glass pad"><h3 class="h">Барический градиент</h3><div class="prose"><p><b>Барический градиент</b> – вектор, направленный по нормали к изобарической поверхности в сторону уменьшения давления; по модулю равен изменению давления на единицу расстояния. Его вертикальная составляющая уравновешивается силой тяжести.</p><p><b>Горизонтальное движение воздуха вызывает только горизонтальная составляющая барического градиента.</b> Её выражают в гПа на 100 км, обычно 1–5 гПа/100 км: чем гуще изобары, тем сильнее ветер.</p></div></div></div>
 <div class="bar-types">${Object.values(FORM).map(x=>`<div class="glass"><h4>${x[0]}</h4><p>${x[3]}</p></div>`).join('')}</div>
 ${PLAIN(`<p>Карта изобар похожа на карту рельефа: циклон – «котловина», антициклон – «холм», ложбина – «овраг», гребень – «отрог», седловина – «перевал». Воздух хочет скатиться из высокого давления в низкое, но вращение Земли разворачивает его, и он кружит вдоль изобар.</p>`)}`,
 model:`<div class="glass pad"><div class="row" style="justify-content:space-between;gap:14px"><div class="seg" data-f>${Object.entries(FORM).map(([k,v],i)=>`<button type="button" data-v="${k}" aria-pressed="${i===0}">${v[0]}</button>`).join('')}</div>

   <svg class="chart" id="ch26" viewBox="0 0 340 230" role="img" aria-label="Изобары выбранной барической системы"></svg></div>
  <div class="callout" data-d></div>`,
 flight:`<div class="glass pad case"><h3 class="h">Барическое поле и маршрут</h3><div class="prose"><p>По приземной карте экипаж оценивает, через какие барические системы пройдёт маршрут. Густые изобары – сильный ветер и болтанка у земли; ось ложбины – возможный фронт с облачностью и осадками; центр антициклона зимой – слабый ветер, дымка и туманы.</p><p>Пролёт из антициклона в циклон с постоянным показанием высотомера – это полёт «из высокого в низкое» (раздел 2.5).</p></div></div>`,

 mount:{model(el){const svg=el.querySelector('#ch26');let fm=()=> 'c',wm=()=> 'g';
  const draw=()=>{const F=FORM[fm()],mode=wm(),P=F[1];el.querySelector('[data-d]').innerHTML=`<b>${F[0]}.</b> ${F[3]}`;
   const W=340,H=230,ax=1,ay=0.68,X=x=>W/2+x*(W/2-8)/ax,Y=y=>H/2-y*(H/2-8)/ay,nx=68,ny=46,gx=i=>-ax+2*ax*i/nx,gy=j=>ay-2*ay*j/ny;
   const G=[];let lo=1e9,hi=-1e9;for(let j=0;j<=ny;j++){G[j]=[];for(let i=0;i<=nx;i++){const v=P(gx(i),gy(j));G[j][i]=v;lo=Math.min(lo,v);hi=Math.max(hi,v)}}
   let s='';
   for(let lv=Math.ceil(lo/4)*4;lv<=hi;lv+=4){let d='';
    for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=G[j][i],b=G[j][i+1],c=G[j+1][i+1],e=G[j+1][i],pts=[];
     const ed=(v1,v2,x1,y1,x2,y2)=>{if((v1-lv)*(v2-lv)<0){const k=(lv-v1)/(v2-v1);pts.push([x1+(x2-x1)*k,y1+(y2-y1)*k])}};
     const X0=X(gx(i)),X1=X(gx(i+1)),Y0=Y(gy(j)),Y1=Y(gy(j+1));ed(a,b,X0,Y0,X1,Y0);ed(b,c,X1,Y0,X1,Y1);ed(c,e,X1,Y1,X0,Y1);ed(e,a,X0,Y1,X0,Y0);
     for(let q=0;q+1<pts.length;q+=2)d+=`M${pts[q][0].toFixed(1)} ${pts[q][1].toFixed(1)}L${pts[q+1][0].toFixed(1)} ${pts[q+1][1].toFixed(1)}`}
    s+=`<path d="${d}" fill="none" stroke="var(--chart-2)" stroke-opacity=".75" stroke-width="1.1"/>`;
    for(let i=nx;i>0;i--){const v1=G[3][i],v0=G[3][i-1];if((v1-lv)*(v0-lv)<=0){s+=`<text x="${X(gx(i))}" y="${Y(gy(3))+3}" style="paint-order:stroke;stroke:var(--bg);stroke-width:3px">${lv}</text>`;break}}}
   const col=mode==='w'?'var(--lime-line)':'var(--ink-2)';
   for(let yy=-0.5;yy<=0.51;yy+=0.25)for(let xx=-0.8;xx<=0.81;xx+=0.2){const h=1e-3,gxv=-(P(xx+h,yy)-P(xx-h,yy))/(2*h),gyv=-(P(xx,yy+h)-P(xx,yy-h))/(2*h),m=Math.hypot(gxv,gyv);if(m<2)continue;
    let ux=gxv/m,uy=gyv/m;if(mode==='w'){const an=-60*Math.PI/180,rx=ux*Math.cos(an)-uy*Math.sin(an),ry=ux*Math.sin(an)+uy*Math.cos(an);ux=rx;uy=ry}
    const x0=X(xx),y0=Y(yy),x1=x0+ux*16,y1=y0-uy*16,a=Math.atan2(y1-y0,x1-x0);
    s+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}L${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${col}" stroke-width="1.6"/><path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${(x1-6*Math.cos(a-0.45)).toFixed(1)} ${(y1-6*Math.sin(a-0.45)).toFixed(1)}L${(x1-6*Math.cos(a+0.45)).toFixed(1)} ${(y1-6*Math.sin(a+0.45)).toFixed(1)}Z" fill="${col}"/>`}
   F[2].forEach(([x,y,l])=>{s+=`<text x="${X(x)}" y="${Y(y)+7}" text-anchor="middle" style="font-size:20px;font-weight:600;fill:${l==='Н'?'var(--lime-ink)':'var(--ink)'};paint-order:stroke;stroke:var(--bg);stroke-width:4px">${l}</text>`});
   s+=`<text x="6" y="${H-4}">${mode==='w'?'ветер у земли, Северное полушарие: отклонение от изобар около 30° к низкому давлению':'горизонтальный барический градиент – к низкому давлению'}</text>`;
   svg.innerHTML=s};
  fm=seg(el,'[data-f]',draw);wm=seg(el,'[data-w]',draw);draw();el.addEventListener('rerender',draw)}},
