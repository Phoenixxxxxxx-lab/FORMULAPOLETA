:root { --bg: #07090F; --ink: #EEF1F7; --ink-2: #9AA3B5; --err: #FF6B61; }
html[data-theme="aero"]  { --c1: #2A1478; --c2: #6A3FD1; --c3: #C0306A; --c4: #E8323A; --gs: rgba(170,40,110,.55); }
html[data-theme="meteo"] { --c1: #0B0B0C; --c2: #26300F; --c3: #8DB51C; --c4: #C6F432; --gs: rgba(141,181,28,.45); }
html[data-theme="anav"]  { --c1: #071A3A; --c2: #0B4FA8; --c3: #1A9BD8; --c4: #45D3E3; --gs: rgba(26,155,216,.5); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Unbounded", "Segoe UI", Arial, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
.lk-bg { position: fixed; inset: -20%; filter: blur(90px) saturate(120%); opacity: .85; pointer-events: none; }
.lk-bg i { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: lkDrift 26s ease-in-out infinite alternate; }
.lk-bg i:nth-child(1) { width: 60vmax; height: 60vmax; left: 0;   top: 5%;  background: var(--c2); }
.lk-bg i:nth-child(2) { width: 50vmax; height: 50vmax; right: 0;  top: 30%; background: var(--c4); opacity: .7; animation-duration: 32s; animation-delay: -8s; }
.lk-bg i:nth-child(3) { width: 45vmax; height: 45vmax; left: 30%; bottom: 0; background: var(--c3); opacity: .7; animation-duration: 38s; animation-delay: -15s; }
.lk-bg i:nth-child(4) { width: 40vmax; height: 40vmax; left: 10%; top: 50%; background: var(--c1); animation-duration: 30s; animation-delay: -4s; }
@keyframes lkDrift { from { transform: translate(-4%, -3%) scale(1); } to { transform: translate(5%, 4%) scale(1.12); } }
.lk-veil { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 40%, rgba(7,9,15,.15), rgba(7,9,15,.8)); pointer-events: none; }
.lk-wrap { position: relative; min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.lk-card { width: min(420px, 100%); padding: 36px 32px 28px; border-radius: 28px; background: rgba(14,18,28,.55); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 80px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); text-align: center; animation: lkIn .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes lkIn { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.lk-logo { width: 64px; height: 64px; border-radius: 16px; display: block; margin: 0 auto 18px; box-shadow: 0 10px 30px -8px var(--gs); }
.lk-card h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.lk-sub { margin: 10px 0 26px; font-size: 12px; font-weight: 300; line-height: 1.6; color: var(--ink-2); }
.lk-field { position: relative; }
.lk-field input { width: 100%; height: 50px; padding: 0 50px 0 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: var(--ink); font: 400 14px/1 "Unbounded", "Segoe UI", Arial, sans-serif; letter-spacing: .02em; outline: none; transition: border-color .2s, box-shadow .2s, background .2s; }
.lk-field input::placeholder { color: rgba(238,241,247,.38); }
.lk-field input:focus { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.09); box-shadow: 0 0 0 4px rgba(255,255,255,.06); }
.lk-eye { position: absolute; right: 6px; top: 6px; width: 38px; height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; }
.lk-eye:hover { color: var(--ink); background: rgba(255,255,255,.06); }
.lk-eye svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.lk-eye .off { display: none; } .lk-eye.on .on { display: none; } .lk-eye.on .off { display: block; }
.lk-remember { display: flex; align-items: center; gap: 10px; margin: 16px 2px 0; font-size: 11px; font-weight: 300; color: var(--ink-2); cursor: pointer; user-select: none; text-align: left; }
.lk-remember input { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; margin: 0; border-radius: 6px; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.05); display: grid; place-items: center; cursor: pointer; flex: none; }
.lk-remember input:checked { background: linear-gradient(120deg, var(--c2), var(--c4)); border-color: transparent; }
.lk-remember input:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.lk-btn { position: relative; width: 100%; height: 50px; margin-top: 22px; border: 0; border-radius: 14px; cursor: pointer; color: #fff; font: 600 14px/1 "Unbounded", "Segoe UI", Arial, sans-serif; letter-spacing: .02em; background: linear-gradient(120deg, var(--c1) 0%, var(--c2) 40%, var(--c3) 78%, var(--c4) 100%); background-size: 140% 100%; box-shadow: 0 14px 34px -12px var(--gs), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .15s, background-position .5s, box-shadow .3s; }
html[data-theme="meteo"] .lk-btn { color: #0B0B0C; background: linear-gradient(120deg, #6E8F12 0%, #8DB51C 45%, #C6F432 100%); background-size: 140% 100%; }
.lk-btn:hover { background-position: 100% 0; transform: translateY(-1px); }
.lk-btn:active { transform: translateY(0); }
.lk-btn[disabled] { cursor: progress; opacity: .8; }
.lk-btn .sp { display: none; width: 18px; height: 18px; margin: auto; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: lkSpin .8s linear infinite; }
.lk-btn.busy span { display: none; } .lk-btn.busy .sp { display: block; }
@keyframes lkSpin { to { transform: rotate(360deg); } }
.lk-err { min-height: 18px; margin: 14px 0 0; font-size: 11px; font-weight: 400; color: var(--err); opacity: 0; transition: opacity .2s; }
.lk-err.show { opacity: 1; }
.lk-card.shake { animation: lkShake .45s ease; }
@keyframes lkShake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.lk-foot { margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.08); font-size: 10px; font-weight: 300; line-height: 1.6; color: rgba(154,163,181,.75); }
.lk-auto .lk-card { display: none; }
.lk-loader { display: none; position: fixed; inset: 0; place-items: center; }
.lk-auto .lk-loader { display: grid; }
.lk-loader div { text-align: center; font-size: 12px; font-weight: 300; color: var(--ink-2); }
.lk-loader img { width: 56px; height: 56px; border-radius: 14px; display: block; margin: 0 auto 16px; animation: lkPulse 1.4s ease-in-out infinite; }
@keyframes lkPulse { 50% { transform: scale(.94); opacity: .7; } }
@media (prefers-reduced-motion: reduce) { .lk-bg i, .lk-card, .lk-loader img { animation: none; } }
@media (max-width: 420px) { .lk-card { padding: 30px 22px 24px; border-radius: 24px; } .lk-card h1 { font-size: 20px; } }
</style>
</head>

<script>
(function () {
  'use strict';
  var KEY = 'fpLockKey.v1', ITER = 310000;
  var SALT = new TextEncoder().encode('formula-poleta.lock.v1');
  var form = document.getElementById('lkForm'), pw = document.getElementById('lkPw'),
      btn = document.getElementById('lkBtn'), err = document.getElementById('lkErr'),
      rem = document.getElementById('lkRem'), eye = document.getElementById('lkEye');

  function store(kind) { try { return window[kind]; } catch (e) { return null; } }
  function getSaved() {
    var v = null;
    ['sessionStorage', 'localStorage'].forEach(function (k) { var s = store(k); try { v = v || (s && s.getItem(KEY)); } catch (e) {} });
    return v;
  }
  function save(b64, persist) {
    var s = store(persist ? 'localStorage' : 'sessionStorage'), t = store('sessionStorage');
    try { s && s.setItem(KEY, b64); } catch (e) {}
    try { t && t.setItem(KEY, b64); } catch (e) {}
  }
  function forget() { ['sessionStorage', 'localStorage'].forEach(function (k) { var s = store(k); try { s && s.removeItem(KEY); } catch (e) {} }); }
  function b64ToBytes(b64) { var bin = atob(b64), n = bin.length, u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i); return u; }
  function bytesToB64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }

  var data = null;
  function payload() { if (!data) data = b64ToBytes(document.getElementById('lkData').textContent.replace(/\s+/g, '')); return data; }

  function derive(pass) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: SALT, iterations: ITER, hash: 'SHA-256' }, base, 256); })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  function unlock(raw) {
    var d = payload();
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.subarray(0, 12) }, key, d.subarray(12)); })
      .then(function (buf) { return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); });
  }
  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }
  function fail(msg) {
    btn.disabled = false; btn.classList.remove('busy');
    err.textContent = msg; err.classList.add('show');
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    pw.select();
  }

  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
    fail('Браузер устарел. Откройте сайт в свежей версии Chrome, Safari, Edge или Firefox');
    btn.disabled = true;
    return;
  }

  eye.addEventListener('click', function () {
    var on = pw.type === 'password'; pw.type = on ? 'text' : 'password';
    eye.classList.toggle('on', on); eye.setAttribute('aria-label', on ? 'Скрыть пароль' : 'Показать пароль'); pw.focus();
  });
  pw.addEventListener('input', function () { err.classList.remove('show'); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!pw.value) return;
    btn.disabled = true; btn.classList.add('busy'); err.classList.remove('show');
    var raw;
    derive(pw.value)
      .then(function (r) { raw = r; return unlock(r); })
      .then(function (html) { save(bytesToB64(raw), rem.checked); show(html); })
      .catch(function () { fail('Неверный пароль. Попробуйте ещё раз'); });
  });

  var saved = getSaved();
  if (saved) {
    document.documentElement.classList.add('lk-auto');
    unlock(b64ToBytes(saved)).then(show).catch(function () {
      forget(); document.documentElement.classList.remove('lk-auto'); pw.focus();
    });
  }
})();
</script>
