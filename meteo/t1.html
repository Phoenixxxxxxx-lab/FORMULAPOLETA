<style>
.col{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}

<body>
<script>
(function(){
const {f,sg,ro,ISA,slider,vals,out,bind}=FP; const FT=ISA.FT;
const hs=[];for(let h=0;h<=20000;h+=250)hs.push(h);
const PLAIN=b=>`<div class="plain"><div class="kick">Простыми словами</div>${b}</div>`;

/* ---------- 1.1 ---------- */
const TL=[[-350,'Аристотель пишет «Метеорологику» – первое систематическое описание атмосферных явлений с попытками их объяснения. Его ученик Теофраст в «Книге знаков» предсказывает погоду по приметам, например по гало вокруг Солнца и Луны.'],
 [1643,'Э. Торричелли открывает атмосферное давление и создаёт ртутный барометр. В XVII веке появляются и другие основные приборы: термометр Галилея (1592), гигрометр Ф. Фолли (1664), анемометр Р. Гука (1667).'],
 [1722,'По указу Петра I в Санкт-Петербурге начинаются систематические наблюдения за погодой.'],
 [1849,'В Петербурге учреждена Главная физическая обсерватория, ныне Главная геофизическая обсерватория им. А. И. Воейкова.'],
 [1854,'Балаклавская буря разбивает 60 кораблей. У. Леверье по собранным сводкам показывает, что её можно было предвидеть. Так рождается синоптический метод.'],
 [1872,'Главная физическая обсерватория начинает выпускать ежедневные синоптические карты. Эту дату считают днём рождения службы погоды в России.'],
 [1917,'В. Бьеркнес вводит понятие атмосферного фронта.'],
 [1921,'Декрет об организации метеорологической службы в РСФСР. Начинается первый этап развития авиационной метеорологии.'],
 [1930,'П. А. Молчанов запускает первый в мире радиозонд – начинается трёхмерный анализ атмосферы.'],
 [1960,'Запущен первый метеорологический спутник TIROS-1. Информация со спутников и метеорадиолокаторов меняет метеообеспечение авиации.'],
 [1990,'Начинается современный этап: автоматизированные измерительные системы, цифровая обработка данных, искусственный интеллект и наукастинг.']];
const s11={id:'s11',n:'1.1',title:'Общие сведения об атмосфере',h1:'Атмосфера <em class="acc">как</em> рабочая среда',
 rpd:'Раздел 1 «Введение. Состав и строение атмосферы»',
 f:String.raw`\(\Delta m = \dfrac{\Delta p}{g}\)`,
 tabs:{theory:String.raw`
 <p class="lead"><b>Метеорология</b> (от др.-греч. μετέωρος – «небесный» и λογία – «учение») – научно-прикладная область знания о строении и свойствах атмосферы Земли и протекающих в ней физических и химических процессах. <b>Авиационная метеорология</b> – её специализированная прикладная отрасль: она изучает влияние метеорологических условий на авиационную технику и деятельность авиации и разрабатывает теоретические и методические основы метеорологического обеспечения полётов.</p>
 <div class="cols">
  <div class="glass pad"><h3 class="h">Погода и климат</h3><div class="prose">
   <p><b>Погода</b> – состояние атмосферы, характеризующееся комплексом атмосферных явлений и физических (метеорологических) величин в определённый момент или промежуток времени.</p>
   <p><b>Климат</b> – многолетний, относительно устойчивый режим погоды в данном регионе, определяемый его географическими условиями. Представление о климате складывается на основе статистической обработки результатов многолетних наблюдений.</p>
   <p><b>Климатообразующие факторы</b> – условия, которые обеспечивают атмосферу теплом и влагой и определяют динамику воздушных течений: географическая широта, циркуляция атмосферы и характер подстилающей поверхности.</p></div></div>
  <div class="glass pad"><h3 class="h">Атмосфера и её масса</h3><div class="prose">
   <p><b>Атмосфера</b> – газовая оболочка Земли, механическая смесь газов (воздух) и взвешенных в ней аэрозолей: пыли, капель воды, кристаллов льда, морских солей, продуктов горения. Резкой верхней границы нет: переход к межпланетному пространству постепенный.</p>
   <p>Масса атмосферы – около \(5{,}15\cdot10^{18}\) кг, примерно в миллион раз меньше массы Земли. Давление на уровне равно весу столба воздуха над единицей площади, поэтому доля массы ниже высоты \(H\):</p>
   <p>\[\dfrac{m(H)}{m} = 1 - \dfrac{p(H)}{p_0}\]</p>
   <p>Ниже 5 км сосредоточено около 50 % массы атмосферы, ниже 10 км – около 75 %, ниже 20 км – около 95 %, ниже 30 км – около 99 %.</p></div></div>
 </div>
 <h3 class="h" style="margin-top:6px">Основные принципы деления атмосферы</h3>
 <div class="princ">
  <div class="glass"><h4>По температуре</h4><p>Тропосфера, стратосфера, мезосфера, термосфера, экзосфера и переходные слои между ними – паузы. Граница проходит там, где меняется характер изменения температуры с высотой. Это деление основное в метеорологии и авиации.</p></div>
  <div class="glass"><h4>По составу</h4><p>Гомосфера (примерно до 94–100 км): состав сухого воздуха однороден, газы в молекулярном состоянии. Выше – гетеросфера: молекулы диссоциируют, с высотой преобладают гелий и водород.</p></div>
  <div class="glass"><h4>По ионизации</h4><p>Нейтросфера и ионосфера (примерно от 60–85 км до 500 км и выше, слои D, E, F). Ионосфера отражает радиоволны КВ-диапазона и влияет на дальнюю радиосвязь.</p></div>
  <div class="glass"><h4>По влиянию поверхности</h4><p>Пограничный слой (слой трения, до 1–1,5 км), в нижней его части – приземный слой высотой от десятков до сотен метров. Выше – свободная атмосфера.</p></div>
 </div>
 <h3 class="h" style="margin-top:6px">Этапы развития авиационной метеорологии</h3>
 <div class="stages">
  <div class="glass"><b>1921–1940</b><p>Создание специализированной авиационной метеослужбы и сети авиаметеостанций, первые метеоисследования в интересах авиации.</p></div>
  <div class="glass"><b>1940–1960</b><p>Карты барической топографии, воздушная разведка погоды, оперативно-прогностические центры.</p></div>
  <div class="glass"><b>1960–1990</b><p>Информация метеоспутников и метеорадиолокаторов, автоматические и самопишущие приборы на аэродромах.</p></div>
  <div class="glass"><b>С 1990</b><p>Информационно-измерительные системы, автоматизация анализа, искусственный интеллект, наукастинг – прогноз на ближайшие 2–6 ч.</p></div>
 </div>
 ${PLAIN(`<p>Погода – это то, что над аэродромом сейчас и в ближайшие часы. Климат – то, что здесь «обычно бывает» в это время года. Пилоту нужно и то и другое: климат подсказывает, к чему готовиться, погода решает, лететь ли сегодня.</p><p>Атмосфера очень «прижата» к Земле: половина всего воздуха лежит ниже 5 км. Выше воздуха становится всё меньше, поэтому самолёты летают только в тропосфере и нижней стратосфере.</p>`)}`,
 model:`<div class="glass pad">${slider('m11H','Высота',0,30000,100,5000)}</div><div class="ro-grid" data-ro></div>
  <div class="glass pad"><h3 class="h">Доля массы атмосферы ниже высоты</h3><svg class="chart" id="ch11" viewBox="0 0 340 270" role="img" aria-label="Доля массы атмосферы ниже высоты"></svg></div>
  <div class="glass pad tl-card"><h3 class="h">Как метеорология стала наукой</h3><div class="tl-row" data-tl></div><div class="yr" data-y style="margin-top:14px"></div><p data-t style="margin:.4em 0 0;max-width:72ch"></p></div>`,
 flight:`<div class="cols"><div class="glass pad case"><h3 class="h">DA 40 NG</h3><div class="prose"><p>Перед учебным полётом экипаж изучает фактическую погоду и прогноз по аэродромам вылета, посадки и запасному. Вылет разрешается, только если условия не хуже минимума пилота, воздушного судна и аэродрома.</p><p>Весь учебный полёт проходит в нижней тропосфере – в той части атмосферы, где сосредоточены облака, осадки, туманы и болтанка.</p></div></div>
  <div class="glass pad case jet"><h3 class="h">SSJ 100</h3><div class="prose"><p>На эшелоне около 11 км под самолётом уже около трёх четвертей массы атмосферы. Плотность воздуха там примерно в 3,4 раза меньше, чем у земли, поэтому истинная скорость намного больше приборной (раздел 2.4).</p></div></div></div>`,
 quiz:'<div class="quiz quiz-host"></div>'},
 mount:{model(el){
  const row=el.querySelector('[data-tl]');let k=0;
  row.innerHTML=TL.map((e,i)=>`<button type="button" data-i="${i}">${e[0]<0?f(-e[0])+' до н. э.':String(e[0])}</button>`).join('');
  const tl=()=>{row.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i===k));const e=TL[k];el.querySelector('[data-y]').textContent=e[0]<0?f(-e[0])+' г. до н. э.':e[0]+' г.';el.querySelector('[data-t]').textContent=e[1]};
  row.addEventListener('click',e=>{const b=e.target.closest('button');if(b){k=+b.dataset.i;tl()}});tl();
  const hs30=[];for(let h=0;h<=30000;h+=250)hs30.push(h);
  bind(el,()=>{const [H]=vals(el,['m11H']),p=ISA.P(H),m=1-p/ISA.P0;out(el,'m11H',`${f(H)} м`);
  el.querySelector('[data-ro]').innerHTML=ro('hl','Ниже этой высоты',`${f(m*100,1)} %`,'массы атмосферы')+ro('','Выше этой высоты',`${f(100-m*100,1)} %`,'массы атмосферы')+ro('','Давление',`${f(p/100)} гПа`,`${f(p/ISA.P0*100)} % от уровня моря`);
  FP.plot(el.querySelector('#ch11'),{x0:0,x1:100,y0:0,y1:30,xt:[0,25,50,75,100],yt:[0,5,10,15,20,25,30],xl:'доля массы ниже H, %',fill:1,band:[11,11.3],bandLabel:'тропопауза',
   series:[{pts:hs30.map(h=>[(1-ISA.P(h)/ISA.P0)*100,h/1000]),c:'var(--lime-line)'}],marks:[[m*100,H/1000,'var(--lime-line)']],hline:H/1000})})}},
 quiz:[['Какая доля массы атмосферы лежит ниже 5 км?',['около половины','около 10 %','около 90 %','около четверти'],'p(5 км) ≈ 540 гПа, то есть ниже лежит около 47 %. Ниже 10 км – около 75 %, ниже 20 км – около 95 %.'],
  ['Чем погода отличается от климата?',['погода – состояние атмосферы в данный момент или промежуток времени, климат – многолетний режим погоды','погода относится к тропосфере, климат – к стратосфере','погода – это прогноз, климат – фактические данные','ничем, это синонимы'],'Климат устанавливается статистической обработкой многолетних наблюдений.'],
  ['Главный для авиации принцип деления атмосферы на слои:',['по характеру изменения температуры с высотой','по составу газов','по степени ионизации','по плотности воздуха'],'Тропосфера, стратосфера, мезосфера и термосфера выделены по ходу температуры.'],
  ['Слой трения (пограничный слой) имеет толщину около:',['1–1,5 км','10–12 км','100 м','50 км'],'Выше 1–1,5 км влияние трения о поверхность становится малым – это свободная атмосфера.'],
  ['Кто запустил первый в мире радиозонд?',['П. А. Молчанов, 1930 г.','В. Бьеркнес, 1917 г.','Э. Торричелли, 1643 г.','М. В. Ломоносов, 1752 г.'],'Радиозонд позволил измерять температуру, давление и влажность по высотам.']]};

/* ---------- 1.2 ---------- */
const GAS=[['Азот, N₂',78.084,75.5],['Кислород, O₂',20.948,23.15],['Аргон, Ar',0.934,1.292],['Углекислый газ, CO₂',0.04,0.06],['Неон, гелий и другие',0.003,0.005]];
const s12={id:'s12',n:'1.2',title:'Газовый состав атмосферы',h1:'Газовый <em class="acc">состав</em> атмосферы',
 rpd:'Раздел 1 «Введение. Состав и строение атмосферы»',f:String.raw`\(p_{O_2} = 0{,}2095\,p\)`,
 tabs:{theory:`<p class="lead">Сухой воздух в пределах гомосферы – механическая смесь газов практически постоянного состава. Постоянство обеспечивается турбулентным перемешиванием. Концентрация переменных составляющих – водяного пара, углекислого газа и озона – меняется в пространстве и во времени.</p>
 <div class="cols"><div class="glass pad"><h3 class="h">Сухой воздух у поверхности, % по объёму</h3><div class="gas">${GAS.map(g=>`<div class="r"><span>${g[0]}</span><span class="bar"><i style="width:${Math.max(g[1],0.6)}%"></i></span><span class="v">${f(g[1],g[1]<0.1?(g[1]<0.01?3:2):2)}</span></div>`).join('')}</div>
  <div class="tbl" style="margin-top:14px"><table><thead><tr><th>Газ</th><th>по объёму, %</th><th>по массе, %</th></tr></thead><tbody>${GAS.map(g=>`<tr><td>${g[0]}</td><td>${f(g[1],g[1]<0.1?3:3)}</td><td>${f(g[2],g[2]<0.1?3:2)}</td></tr>`).join('')}</tbody></table></div>
  <p class="note" style="margin-top:12px">Полоска у малых газов показана с минимальной шириной, чтобы её было видно. Молярная масса сухого воздуха – 28,96 кг/кмоль.</p></div>
 <div class="glass pad"><h3 class="h">Переменные составляющие</h3><div class="prose">
  <p><b>Водяной пар</b> – от долей процента в холодном воздухе до 3–4 % у поверхности в тропиках. Около 90 % всего водяного пара сосредоточено в тропосфере, где он находится в непрерывном круговороте: испарение – конденсация и сублимация – облака – осадки.</p>
  <p>Фазовые переходы воды сопровождаются выделением и поглощением теплоты. На 1 г воды при конденсации выделяется около 600 кал, при замерзании – около 80 кал, при сублимации – около 680 кал. Поэтому водяной пар – главный переносчик скрытой теплоты в атмосфере.</p>
  <p><b>Озон</b> – наибольшая концентрация на высотах около 20–25 км. Поглощает ультрафиолетовое излучение Солнца и нагревает стратосферу.</p>
  <p><b>Аэрозоли</b> – пыль, дым, кристаллы морских солей, вулканический пепел. Ухудшают видимость и служат ядрами конденсации.</p></div></div></div>
 ${PLAIN(`<p>Воздух – это почти 4/5 азота и 1/5 кислорода, остальное – «щепотка» аргона и других газов. Этот рецепт одинаков от земли до высоты около 100 км.</p><p>Меняется в воздухе главным образом количество водяного пара – и именно оно делает погоду: облака, туманы, осадки, обледенение. Когда пар превращается в капли, он отдаёт воздуху тепло. Этот «невидимый обогреватель» питает грозы.</p>`)}`,

  el.querySelector('[data-ro]').innerHTML=ro('','Давление воздуха',`${f(p)} гПа`,'по МСА')+ro('hl','Парциальное давление O₂',`${f(po,1)} гПа`,`${f(po/po0*100)} % от уровня моря`)+ro('','Доля O₂ в воздухе',`${f(20.95,2)} %`,'не меняется с высотой');

const TP=[[0,15],[11,-56.5],[20,-56.5],[32,-44.5],[47,-2.5],[51,-2.5],[71,-58.5],[85,-86],[91,-86],[100,-78]];

const LAY=[[0,11,'Тропосфера','Нижний основной слой. Температура падает с высотой в среднем на 0,65 °C на 100 м. Более 80 % массы атмосферы и около 90 % водяного пара. Развиты турбулентность и конвекция, образуются облака, циклоны и антициклоны. Верхняя граница – 8–10 км в полярных, 10–12 км в умеренных и 16–18 км в тропических широтах; зимой ниже, чем летом.'],
 [11,12,'Тропопауза','Переходный слой толщиной от нескольких сотен метров до 1–2 км, где падение температуры прекращается или резко ослабевает. Средняя температура над полюсом зимой около −65 °C, летом около −45 °C, над экватором −70…−80 °C. Задерживающий слой: под ним скапливаются продукты конденсации, он часто служит верхней границей облачности. Вблизи – струйные течения и турбулентность ясного неба.'],
 [12,50,'Стратосфера','До 20–25 км температура почти постоянна (−56,5 °C в СА), выше растёт почти до 0 °C из-за поглощения ультрафиолета озоном. Ничтожное содержание водяного пара, малая турбулентность, облака редки: перламутровые облака на высотах 20–30 км. Озоносфера с максимумом на 20–25 км.'],
 [50,85,'Мезосфера','Над стратопаузой (≈ 50–55 км, максимум температуры около 0 °C) температура падает со средним градиентом 0,25–0,3 °C на 100 м. Основной процесс – лучистый теплообмен; фотохимические реакции вызывают свечение атмосферы. У верхней границы – мезопауза, самые низкие температуры в атмосфере, около −90 °C, и серебристые облака.'],
 [85,100,'Термосфера','Температура растёт с высотой и на 200–300 км достигает порядка 1500 К. Под действием ультрафиолетового и рентгеновского излучения Солнца газы ионизированы – здесь лежат основные области ионосферы. На высоте 100 км проходит линия Кармана – условная граница атмосферы и космоса. Выше 800 км – экзосфера.']];
const s13={id:'s13',n:'1.3',title:'Строение атмосферы и характеристики слоёв',short:'Строение атмосферы',h1:'Слои <em class="acc">атмосферы</em> по вертикали',
 rpd:'Раздел 1 «Введение. Состав и строение атмосферы»',f:String.raw`\(\gamma = -\dfrac{dT}{dH}\)`,
 tabs:{theory:`<p class="lead">Атмосферу делят на слои по характеру вертикального распределения температуры, то есть по знаку и величине вертикального градиента \\(\\gamma\\). В тропосфере он положительный (температура падает), в изотермическом слое равен нулю, в слоях инверсии отрицательный. Давление и плотность во всех слоях с высотой убывают.</p>
 <div class="layers glass">${LAY.map(l=>`<div class="layer"><b>${l[2]}</b><span>${l[3]}</span></div>`).join('')}</div>
 <div class="cols"><div class="glass pad"><h3 class="h">Метеоусловия в тропосфере и нижней стратосфере</h3><div class="prose"><p>Тропосферу условно делят на нижнюю (до 2,5 км), среднюю (2,5–6 км) и верхнюю (от 6 км до тропопаузы). Особенно изменчива нижняя тропосфера: большой суточный ход температуры, влажности и ветра, облака, осадки, туманы, обледенение, болтанка.</p><p>В нижней стратосфере облаков почти нет, видимость хорошая, ветры сильные и устойчивые по направлению. Опасность представляют турбулентность ясного неба у струйных течений и участки с большим наклоном тропопаузы. Ось струйного течения обычно лежит на 1–1,5 км ниже тропопаузы.</p></div></div>
 <div class="glass pad"><h3 class="h">Озоносфера и ионосфера</h3><div class="prose"><p><b>Озоносфера</b> – слой повышенной концентрации озона в стратосфере. Озон поглощает ультрафиолетовое излучение Солнца и служит источником тепла для стратосферы. При полётах у тропопаузы в высоких широтах концентрация озона в наружном воздухе бывает повышенной, поэтому на магистральных ВС воздух для кабины проходит через нейтрализаторы озона.</p><p><b>Ионосфера</b> – область ионизированного воздуха в мезосфере и термосфере с высокой электропроводностью. Она отражает, преломляет и поглощает радиоволны, особенно КВ-диапазона; с ней связаны полярные сияния и магнитные бури. Возмущения ионосферы ухудшают дальнюю КВ-связь и точность спутниковой навигации.</p></div></div></div>
 ${PLAIN(`<p>Слои атмосферы различаются тем, что делает температура при подъёме. В тропосфере – «чем выше, тем холоднее»: воздух греется от земли, как от плиты. В стратосфере холод останавливается, а выше даже теплеет: там озон поглощает ультрафиолет, как тёмная ткань на солнце.</p><p>Почти вся «погода» живёт в тропосфере. Над ней обычно ясно и спокойно, но у струйных течений бывает сильная болтанка при чистом небе.</p>`)}`,
 model:`<div class="col"><div class="glass pad"><h3 class="h">Разрез атмосферы 0–100 км</h3><svg class="chart" id="ch13" viewBox="0 0 360 420" role="img" aria-label="Разрез атмосферы"></svg></div>
  <div style="display:grid;gap:16px"><div class="glass pad">${slider('m13H','Высота',0,100,0.5,11)}</div><div class="glass pad" id="colInfo"></div></div></div>`,
 flight:`<div class="cols"><div class="glass pad case"><h3 class="h">DA 40 NG</h3><div class="prose"><p>Учебные полёты проходят в нижней части тропосферы, в пределах нескольких километров. Здесь главные метеофакторы: облачность и её нижняя граница, видимость, ветер у земли, турбулентность в пограничном слое и обледенение в облаках.</p></div></div>
 <div class="glass pad case jet"><h3 class="h">SSJ 100</h3><div class="prose"><p>Крейсерские эшелоны – верхняя тропосфера и район тропопаузы, 10–12 км. Экипаж учитывает высоту тропопаузы, струйные течения (попутный или встречный ветер до 200–300 км/ч и выше), турбулентность ясного неба и вершины кучево-дождевых облаков, которые в тропиках могут подниматься выше 15 км.</p></div></div></div>`,

   const W=360,Hh=420,ml=40,mr=150,mt=10,mb=30,pw=W-ml-mr,ph=Hh-mt-mb,X=t=>ml+(t+100)/130*pw,Y=h=>mt+ph-h/100*ph;let s='';
   LAY.forEach((l,i)=>{s+=`<rect x="${ml}" width="${pw}" y="${Y(l[1])}" height="${Y(l[0])-Y(l[1])}" fill="var(--lime)" fill-opacity="${[.16,.28,.08,.04,.12][i]}"/><text x="${ml+pw+8}" y="${(Y(l[0])+Y(l[1]))/2+3}">${l[2]}</text>`});
   [0,20,40,60,80,100].forEach(h=>{s+=`<text x="${ml-6}" y="${Y(h)+3}" text-anchor="end">${h}</text>`});
   [-80,-40,0].forEach(t=>{s+=`<line x1="${X(t)}" x2="${X(t)}" y1="${mt}" y2="${mt+ph}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${X(t)}" y="${mt+ph+14}" text-anchor="middle">${f(t)}</text>`});
   s+=`<rect x="${ml}" width="${pw}" y="${Y(25)}" height="${Y(20)-Y(25)}" fill="none" stroke="var(--lime-line)" stroke-dasharray="3 3"/><text x="${ml+4}" y="${Y(25)-3}">максимум озона</text>`;
   s+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--ink-2)" stroke-dasharray="4 3"/><text x="${ml+4}" y="${Y(100)+11}">линия Кармана</text>`;
   s+=`<path d="${TP.map((p,i)=>(i?'L':'M')+X(p[1]).toFixed(1)+' '+Y(p[0]).toFixed(1)).join('')}" fill="none" stroke="var(--chart-2)" stroke-width="2"/>`;
   s+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(H)}" y2="${Y(H)}" stroke="var(--lime-line)" stroke-width="1.5"/><circle cx="${X(tAt(H))}" cy="${Y(H)}" r="5" fill="var(--lime-line)" stroke="var(--bg)" stroke-width="2"/>`;
   s+=`<text x="${ml+pw/2}" y="${Hh-4}" text-anchor="middle">t, °C</text><text x="12" y="${mt+ph/2}" text-anchor="middle" transform="rotate(-90 12 ${mt+ph/2})">H, км</text>`;
   svg.innerHTML=s;
   const l=LAY.find(x=>H<x[1])||LAY[LAY.length-1];
   el.querySelector('#colInfo').innerHTML=`<div class="kick">Слой</div><h4>${l[2]}</h4><p class="mono" style="margin:0 0 8px">t ≈ ${f(tAt(H),1)} °C на высоте ${f(H,1)} км</p><p style="margin:0">${l[3]}</p><p class="note" style="margin-top:10px">Профиль температуры – по стандартной атмосфере, выше 20 км по расширенной модели. Высоты границ слоёв даны для средних широт.</p>`})}},

  ['В каком слое температура растёт с высотой из-за поглощения ультрафиолета озоном?',['в стратосфере выше 20–25 км','в тропосфере','в мезосфере','в пограничном слое'],'Нагрев за счёт озона создаёт рост температуры в верхней стратосфере.'],

const s14={id:'s14',n:'1.4',title:'Стандартная атмосфера',h1:'Стандартная <em class="acc">атмосфера</em>',
 rpd:'Раздел 1 «Введение. Состав и строение атмосферы», практическое занятие № 1',
 f:String.raw`\(T = T_0 - \beta H\)`,
 tabs:{theory:String.raw`<p class="lead"><b>Стандартная атмосфера (СА)</b> – условное вертикальное распределение температуры, давления и плотности воздуха, которое по международному соглашению представляет среднегодовое состояние атмосферы для средних широт (около 45° с. ш.). В России действует ГОСТ 4401-81 «Атмосфера стандартная», соответствующий стандарту ISO и стандартной атмосфере ИКАО (МСА, ISA).</p>
 <div class="cols"><div class="glass pad"><h3 class="h">Исходные условия</h3><div class="prose">
  <p>Воздух – сухой идеальный газ, ветра нет; \(R = 287{,}05\) Дж/(кг·K), \(g_0 = 9{,}80665\) м/с², молярная масса 28,96 кг/кмоль.</p>
  <p>На уровне моря: \(t_0 = +15\) °C (\(T_0 = 288{,}15\) K), \(p_0 = 1013{,}25\) гПа (760 мм рт. ст.), \(\rho_0 = 1{,}225\) кг/м³, \(a_0 = 340{,}3\) м/с.</p>
  <p>Вертикальный градиент температуры \(\beta = 0{,}0065\) K/м до 11 000 м. От 11 000 до 20 000 м температура постоянна: −56,5 °C.</p></div></div>
 <div class="glass pad"><h3 class="h">Основные зависимости</h3><div class="prose">
  <p>\[T = T_0 - \beta H\]</p><p>\[p = p_0\left(1 - \dfrac{\beta H}{T_0}\right)^{5{,}256}\]</p><p>\[\rho = \dfrac{p}{RT},\qquad a = \sqrt{kRT} \approx 20{,}05\sqrt{T}\ \text{м/с}\]</p>
  <p>Основа расчёта – уравнение статики атмосферы и барометрическая формула (раздел 2.5).</p></div></div></div>
 <div class="glass pad"><h3 class="h">Для чего нужна СА</h3><div class="prose">
  <p>СА – метрологическая основа для градуировки пилотажно-навигационных приборов (барометрического высотомера, указателя скорости), аэродинамических и конструкторских расчётов и аэрологических исследований. Все лётно-технические характеристики в РЛЭ приводятся к условиям СА, что позволяет сравнивать результаты испытаний разных самолётов в разные дни.</p></div></div>
 ${PLAIN(`<p>СА – это «средний день на средней широте», записанный в таблицу. Все приборы и все цифры в руководстве по лётной эксплуатации считаются для этого воображаемого дня: +15 °C и 760 мм у моря, минус 6,5 °C на каждый километр подъёма до 11 км, а выше – ровные −56,5 °C.</p>`)}`,
 model:`<div class="glass pad">${slider('m14H','Высота',0,20000,50,3000)}</div><div class="ro-grid" data-ro></div>
  <div class="cols"><div class="glass pad"><h3 class="h">Температура</h3><svg class="chart" id="ch14t" viewBox="0 0 340 270"></svg></div><div class="glass pad"><h3 class="h">Давление и плотность</h3><svg class="chart" id="ch14p" viewBox="0 0 340 270"></svg><div class="legend"><span><i style="border-color:var(--chart-2)"></i>p, гПа</span><span><i style="border-color:var(--lime-line)"></i>ρ, ‰ от ρ₀</span></div></div></div>
  <div class="glass pad"><h3 class="h">Таблица СА</h3><div class="tbl"><table data-tbl></table></div><p class="note">Строка, ближайшая к заданной высоте, выделена.</p></div>`,

 rpd:'Раздел 1 «Введение. Состав и строение атмосферы», практическое занятие № 1',f:String.raw`\(T = T_{СА}(H) + \Delta T\)`,
 tabs:{theory:String.raw`<p class="lead">Реальная атмосфера в конкретный момент и в конкретном пункте почти никогда не совпадает со стандартной. Температура, давление и плотность отличаются от табличных, и вместе с ними меняются показания приборов и лётные характеристики ВС.</p>
 <div class="cols"><div class="glass pad"><h3 class="h">Отклонение от СА</h3><div class="prose"><p>Отклонение температуры \(\Delta T = t - t_{СА}(H)\) записывают как ISA ± ΔT. При одинаковом давлении тёплый воздух менее плотный:</p><p>\[\rho = \dfrac{p}{R\,(T_{СА} + \Delta T)}\]</p><p>С СА связаны <b>стандартные высоты</b>: барометрическая высота – высота в СА, на которой давление равно фактическому на уровне полёта, и высота по плотности (плотностная) – высота в СА с той же плотностью, что и фактическая. Именно по плотности «чувствуют» высоту крыло и винт.</p></div></div>
 <div class="glass pad"><h3 class="h">Две практические задачи</h3><div class="prose"><p><b>От реальных условий к СА.</b> Результаты испытаний, полученные в разные дни, приводят к СА, чтобы сравнивать их между собой. Например, чтобы определить, у какого самолёта выше потолок.</p><p><b>От СА к реальным условиям.</b> Расчётные характеристики из РЛЭ пересчитывают на условия конкретного дня: разбег, скороподъёмность, достижимую скорость и эшелон.</p></div></div></div>
 <div class="glass pad"><h3 class="h">Влияние отклонений на безопасность полётов</h3><div class="prose"><p><b>Жара и высокогорье.</b> Плотностная высота растёт: длиннее разбег и пробег, хуже скороподъёмность.</p><p><b>Холод.</b> Барометрический высотомер показывает больше истинной высоты: запас над препятствиями меньше расчётного.</p><p><b>Эшелон.</b> От температуры зависят скорость звука, истинная скорость при заданном числе M, тяга двигателя и потолок.</p></div></div>
 ${PLAIN(`<p>Реальный день почти всегда отличается от «среднего»: теплее или холоднее. Поэтому пилот всегда спрашивает себя, насколько сегодня отклонение от СА. От этой разницы зависят разбег, тяга, потолок и ошибка высотомера.</p>`)}`,
